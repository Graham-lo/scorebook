[package]
name = "scorebook-infrastructure"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
anyhow = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1"
scorebook-core = { path = "../core" }

quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
hmac = "0.12"
bigdecimal = { version = "0.4.10", features = ["serde"] }

zeroize = "1"

utoipa = { version = "5", features = ["chrono", "uuid"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
