[workspace]
members = [".","crates/core","crates/infrastructure","crates/http"]
resolver = "3"

[package]
name = "scorebook"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "scorebook"

[dependencies]
zeroize = "1"
scorebook-core = { path = "crates/core" }
scorebook-infrastructure = { path = "crates/infrastructure" }
scorebook-http = { path = "crates/http" }
anyhow = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
bigdecimal = { version = "0.4.10", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
vision-tests = []

[[test]]
name = "vision"
required-features = ["vision-tests"]
