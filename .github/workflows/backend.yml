name: Backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: scorebook
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: scorebook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U scorebook'
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://scorebook:ci-local-only@localhost:5432/scorebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: python3 ops/check-boundaries.py
      - run: cargo run --quiet -- openapi > /tmp/openapi.json && diff -u contracts/openapi.json /tmp/openapi.json
