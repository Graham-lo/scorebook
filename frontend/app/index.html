<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trader Foresight</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F6FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体在 main.ts 里按屏幕挑着取：拉丁三款一直要，中文那两款只在宽屏上取。
     手机上中文用系统的苹方，一个字节都不用下——一页中文会把 Noto SC 拆成
     三四十个分片挨个下载，那是手机上最费流量也最费电的一件事。 -->
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6BC4B"/><stop offset="1" stop-color="#EF8D2B"/></linearGradient>
    <linearGradient id="afterGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B63F6" stop-opacity=".14"/><stop offset="1" stop-color="#6B63F6" stop-opacity="0"/></linearGradient>
    <linearGradient id="dawnGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B63F6" stop-opacity=".0"/><stop offset=".35" stop-color="#6B63F6"/><stop offset=".7" stop-color="#EF8D2B"/><stop offset="1" stop-color="#F6BC4B" stop-opacity=".2"/></linearGradient>
    <linearGradient id="dawnArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6BC4B" stop-opacity=".16"/><stop offset="1" stop-color="#F6BC4B" stop-opacity="0"/></linearGradient>
    <radialGradient id="sunGrad" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE7A8"/><stop offset=".6" stop-color="#F6BC4B"/><stop offset="1" stop-color="#EF8D2B"/></radialGradient>
  </defs>
</svg>
<div class="sky" aria-hidden="true"><canvas id="stars"></canvas><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<header class="masthead"><div class="mast">
  <a class="brand" href="#/" aria-label="Trader Foresight 交易先见 首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 17V9M10 17V5M15 17v-7M20 17V8"/></svg></span><span>Trader Foresight<small>交易先见</small></span></a>
  <nav class="tabs" id="nav"></nav>
  <div class="mast-right">
    <button class="btn gold" id="btnCapture" title="记一笔（⌃⇧S）"><span></span>记一笔</button>
    <a class="iconbtn" id="navSettings" href="#/settings" title="设置"><span></span></a>
  </div>
</div>
<div class="subbar" id="subnav" hidden></div></header>
<main id="main" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" hidden></nav>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
