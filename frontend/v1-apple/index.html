<title>Scorebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7; --bg-side:#ededf0; --surface:#ffffff; --surface2:#fafafc; --fill:#f2f2f4; --fill2:#e8e8ec; --fill3:#dcdce1;
  --hair:rgba(0,0,0,.075); --hair2:rgba(0,0,0,.13);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6; --text4:#c7c7cc; --on-accent:#fff;
  --accent:#0071e3; --accent-soft:#e8f1fd; --accent-text:#0b5cc4;
  --crit-bg:#fdf3df; --crit-text:#8a5a00;
  --realized:#1f9d8a; --realized-bg:#e2f5f1; --realized-text:#0f7a69;
  --unrealized:#e8604b; --unrealized-bg:#fdece8; --unrealized-text:#b4402d;
  --pending:#5e5ce6; --pending-bg:#ecebfc; --pending-text:#4a48c4;
  --neutral:#8e8e93;
  --shadow-card:0 0 0 .5px var(--hair), 0 2px 12px rgba(0,0,0,.04);
  --shadow-pop:0 0 0 .5px rgba(0,0,0,.1), 0 12px 40px rgba(0,0,0,.14);
  --shadow-panel:0 0 0 .5px rgba(0,0,0,.14), 0 30px 90px rgba(0,0,0,.28);
  --up:#1d1d1f; --down:#b0b0b5;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1c1c1e; --bg-side:#171719; --surface:#26262a; --surface2:#2b2b30; --fill:#303036; --fill2:#3a3a41; --fill3:#48484f;
  --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.16);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73; --text4:#48484f; --on-accent:#fff;
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --accent-text:#6fb4ff;
  --crit-bg:rgba(255,190,80,.14); --crit-text:#f0c26a;
  --realized:#30c9a8; --realized-bg:rgba(48,201,168,.14); --realized-text:#5ddcbf;
  --unrealized:#ff7d66; --unrealized-bg:rgba(255,125,102,.14); --unrealized-text:#ff9a88;
  --pending:#8e8cff; --pending-bg:rgba(142,140,255,.16); --pending-text:#b1b0ff;
  --neutral:#8e8e93;
  --shadow-card:0 0 0 .5px var(--hair), 0 2px 12px rgba(0,0,0,.25);
  --shadow-pop:0 0 0 .5px rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.5);
  --shadow-panel:0 0 0 .5px rgba(255,255,255,.14), 0 30px 90px rgba(0,0,0,.6);
  --up:#f5f5f7; --down:#5c5c63;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1c1e; --bg-side:#171719; --surface:#26262a; --surface2:#2b2b30; --fill:#303036; --fill2:#3a3a41; --fill3:#48484f;
  --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.16);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73; --text4:#48484f; --on-accent:#fff;
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --accent-text:#6fb4ff;
  --crit-bg:rgba(255,190,80,.14); --crit-text:#f0c26a;
  --realized:#30c9a8; --realized-bg:rgba(48,201,168,.14); --realized-text:#5ddcbf;
  --unrealized:#ff7d66; --unrealized-bg:rgba(255,125,102,.14); --unrealized-text:#ff9a88;
  --pending:#8e8cff; --pending-bg:rgba(142,140,255,.16); --pending-text:#b1b0ff;
  --neutral:#8e8e93;
  --shadow-card:0 0 0 .5px var(--hair), 0 2px 12px rgba(0,0,0,.25);
  --shadow-pop:0 0 0 .5px rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.5);
  --shadow-panel:0 0 0 .5px rgba(255,255,255,.14), 0 30px 90px rgba(0,0,0,.6);
  --up:#f5f5f7; --down:#5c5c63;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(0,113,227,.2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)} .faint{color:var(--text3)}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px 1fr;height:100vh}
.sidebar{background:var(--bg-side);border-right:.5px solid var(--hair2);display:flex;flex-direction:column;padding:18px 12px 14px;gap:6px;user-select:none}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,#2b8bff,#0058c9);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35);position:relative}
.brand .mark::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border:2px solid #fff;border-radius:2px;border-right-color:transparent}
.capture-btn{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px 0 14px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin:0 2px 10px;transition:transform .12s ease,filter .12s ease}
.capture-btn:hover{filter:brightness(1.06)} .capture-btn:active{transform:scale(.985)}
.capture-btn .kbd{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--text);font-weight:500;font-size:13.5px;transition:background .12s}
.nav a:hover{background:rgba(0,0,0,.05)} :root[data-theme="dark"] .nav a:hover{background:rgba(255,255,255,.06)}
.nav a.active{background:rgba(0,0,0,.08);font-weight:600} :root[data-theme="dark"] .nav a.active{background:rgba(255,255,255,.1)}
.nav a .ico{width:18px;height:18px;flex:none;color:var(--accent)}
.nav a .cnt{margin-left:auto;font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.nav a.active .cnt{color:var(--text)}
.nav .sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;padding:14px 10px 4px}
.sidebar .spacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:11.5px;color:var(--text3)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--realized)}
main{overflow:auto;position:relative}
.page{max-width:1240px;margin:0 auto;padding:34px 40px 80px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.h1 small{display:block;font-size:13.5px;font-weight:400;color:var(--text2);letter-spacing:0;margin-top:6px}
.h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.h3{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-bottom:14px}
.crumb a{color:var(--text2)} .crumb a:hover{color:var(--accent)}
.crumb .sep{color:var(--text4)}

/* ---------- atoms ---------- */
.kbd{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;background:var(--fill);color:var(--text2);font-size:11px;font-weight:500;line-height:1;box-shadow:inset 0 0 0 .5px var(--hair2);font-family:var(--font)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:9px;background:var(--surface);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 0 0 .5px var(--hair2),0 1px 2px rgba(0,0,0,.05);transition:background .12s,transform .1s}
.btn:hover{background:var(--surface2)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:none} .btn.primary:hover{filter:brightness(1.06)}
.btn.tint{background:var(--fill);box-shadow:none} .btn.tint:hover{background:var(--fill2)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent)} .btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:27px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--unrealized-text)}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pill.lg{height:28px;font-size:13px;padding:0 12px}
.st-realized{background:var(--realized-bg);color:var(--realized-text)} .st-realized .dot{background:var(--realized)}
.st-unrealized{background:var(--unrealized-bg);color:var(--unrealized-text)} .st-unrealized .dot{background:var(--unrealized)}
.st-pending{background:var(--pending-bg);color:var(--pending-text)} .st-pending .dot{background:var(--pending);border-radius:2px}
.st-not_triggered{background:var(--fill);color:var(--text2)} .st-not_triggered .dot{background:transparent;border:1.5px solid var(--neutral);width:6px;height:6px}
.st-no_criteria{background:transparent;color:var(--text2);box-shadow:inset 0 0 0 1px var(--text4)} .st-no_criteria .dot{display:none}
.st-insufficient_data{background:repeating-linear-gradient(135deg,var(--fill) 0 3px,var(--fill2) 3px 5px);color:var(--text2)} .st-insufficient_data .dot{display:none}
.st-waiting{background:var(--fill);color:var(--text2)} .st-waiting .dot{background:var(--neutral)}
.tag{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--fill);color:var(--text);white-space:nowrap}
.tag.cold{background:transparent;box-shadow:inset 0 0 0 1px var(--text4);color:var(--text2)}
.tag.link:hover{background:var(--fill2);cursor:pointer}
.crit{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--crit-bg);color:var(--crit-text);font-weight:600;font-size:12px;white-space:nowrap}
.crit .sub{font-weight:500;opacity:.8}
.ver{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--fill);color:var(--text2);white-space:nowrap}
.ver.adopted{background:var(--accent-soft);color:var(--accent-text)}
.ver.candidate{background:transparent;border:1px dashed var(--text3);height:20px}
.ver.withdrawn{text-decoration:line-through;opacity:.7}
.stance{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-family:var(--mono);font-weight:700;font-size:12px;background:var(--text);color:var(--bg);flex:none}
.stance.soft{background:var(--fill2);color:var(--text)}
.stance.S{background:var(--text)} 
.mkt{font-size:11.5px;color:var(--text2);padding:0 6px;height:20px;display:inline-flex;align-items:center;border-radius:5px;background:var(--fill)}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card)}
.card.pad{padding:18px 20px}
.hr{height:.5px;background:var(--hair2)}
.row{display:flex;align-items:center;gap:8px} .col{display:flex;flex-direction:column;gap:8px}
.quote{font-size:15px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.quote.lg{font-size:17px;line-height:1.55;letter-spacing:-.005em}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text2);transition:all .12s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--hair)}
.seg button:hover:not(.on){color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 .5px var(--hair2);font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;transition:background .12s;position:relative}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--text);color:var(--bg);box-shadow:none}
.chip .chev{width:10px;height:10px;opacity:.5}
.chip .x{margin-left:2px;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);font-size:11px}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:180px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:30;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-3px) scale(.98)}to{opacity:1;transform:none}}
.pop button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 10px;border-radius:7px;font-size:13px;text-align:left}
.pop button:hover{background:var(--accent);color:#fff}
.pop button .chk{width:14px;color:inherit;opacity:0} .pop button.on .chk{opacity:1}
.tip{font-size:12px;color:var(--text2);line-height:1.5}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--fill);font-size:12.5px;line-height:1.5;color:var(--text2)}
.note.warn{background:var(--crit-bg);color:var(--crit-text)}
.note.info{background:var(--accent-soft);color:var(--accent-text)}
.note .i{flex:none;width:16px;height:16px;margin-top:1px}
.thumb{width:132px;height:84px;border-radius:9px;background:#0f1218;object-fit:cover;flex:none;box-shadow:0 0 0 .5px var(--hair2)}
.thumb.none{display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--text3);font-size:11.5px;text-align:center;line-height:1.35;padding:6px}
.disc{border-top:.5px solid var(--hair2)}
.disc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:40px;font-size:12.5px;color:var(--text2);user-select:none}
.disc summary::-webkit-details-marker{display:none}
.disc summary .tri{width:10px;height:10px;transition:transform .15s;color:var(--text3)}
.disc[open] summary .tri{transform:rotate(90deg)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--text3);margin:0} .kv dd{margin:0;color:var(--text2)}
.empty{padding:48px 20px;text-align:center;color:var(--text2)}
.empty .h3{color:var(--text);margin-bottom:6px}
.empty .art{width:56px;height:56px;border-radius:16px;background:var(--fill);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.textarea{width:100%;min-height:86px;resize:vertical;padding:10px 12px;border-radius:10px;border:0;background:var(--fill);color:var(--text);font-size:13.5px;line-height:1.55}
.textarea:focus{outline:none;background:var(--surface);box-shadow:0 0 0 1px var(--hair2),0 0 0 4px var(--accent-soft)}
.input{height:34px;padding:0 12px;border-radius:9px;border:0;background:var(--fill);color:var(--text);font-size:13.5px;width:100%}
.input:focus{outline:none;background:var(--surface);box-shadow:0 0 0 1px var(--hair2),0 0 0 4px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--text2);font-weight:500}
.switch{width:38px;height:22px;border-radius:11px;background:var(--fill3);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--realized)} .switch.on::after{transform:translateX(16px)}
.radio{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer}
.radio:hover{background:var(--fill)}
.radio .r{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text4);flex:none}
.radio.on .r{background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px #fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:flex;flex-direction:column;gap:10px}

/* ---------- find ---------- */
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 16px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow-card);margin-bottom:12px;transition:box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 1.5px var(--accent),0 2px 12px rgba(0,113,227,.12)}
.search svg{width:16px;height:16px;color:var(--text3);flex:none}
.search input{flex:1;border:0;background:none;font-size:15px;outline:none;min-width:0}
.search input::placeholder{color:var(--text3)}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters .meta{margin-left:auto;font-size:12.5px;color:var(--text2)}
.rcard{display:grid;grid-template-columns:132px 1fr auto;gap:18px;padding:16px 18px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-card);cursor:pointer;transition:transform .12s,box-shadow .12s;align-items:start}
.rcard:hover{box-shadow:0 0 0 .5px var(--hair2),0 6px 22px rgba(0,0,0,.08);transform:translateY(-1px)}
.rcard .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rcard .sym{font-weight:600;font-size:14px;letter-spacing:-.01em}
.rcard .when{color:var(--text3);font-size:12px;margin-left:auto}
.rcard .q{font-size:14px;line-height:1.55;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.rcard .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:150px}
.rcard .side .res{font-size:12px;color:var(--text2);text-align:right;line-height:1.45}
.rcard .side .res b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.rcard .id{font-family:var(--mono);font-size:11px;color:var(--text4)}
.epi-band{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:2px 4px 6px}
.epi-band .ln{flex:1;height:.5px;background:var(--hair2)}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,7fr) minmax(320px,5fr);gap:22px;align-items:start}
.viewer{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card);overflow:hidden}
.viewer .bar{display:flex;align-items:center;gap:10px;padding:12px 14px}
.viewer .bar .meta{margin-left:auto;font-size:12px;color:var(--text2);display:flex;gap:10px;align-items:center}
.viewer .stage{position:relative;background:var(--fill);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.viewer .stage img{width:100%;height:100%;object-fit:contain;display:block}
.viewer .stage.chart{background:var(--surface);cursor:default;aspect-ratio:16/9}
.viewer .stage .cap{position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;backdrop-filter:blur(8px)}
.viewer .stage.chart .cap{color:var(--text2);background:var(--fill)}
.viewer .stage .badge{position:absolute;right:12px;top:10px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;backdrop-filter:blur(8px)}
.viewer .stage.chart .badge{color:var(--text2);background:var(--fill)}
.viewer .foot{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:12px;color:var(--text2);border-top:.5px solid var(--hair)}
.viewer .foot .gap{margin-left:auto}
.sec{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sec .sh{display:flex;align-items:center;gap:8px}
.sec .sh .h3{flex:1}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.result-line .why{color:var(--text2);font-size:13px}

  // 价格轴与时间轴

  for(let k=0;k<=6;k++){ const v=lo+(hi-lo)*k/6; g.fillText(v.toFixed(1),R+8,Y(v)+4); }
  for(let k=0;k<10;k++){ g.fillText(`${pad(1+k*3)}日`,L+k*(R-L)/10,B+100); }
  // 最新价标签
  const last=bars[bars.length-1]; g.fillStyle=last.c>=last.o?'#26a69a':'#ef5350'; g.fillRect(R,Y(last.c)-11,70,22); g.fillStyle='#fff'; g.font='600 12px -apple-system, Inter, sans-serif'; g.fillText(last.c.toFixed(1),R+8,Y(last.c)+4);
  const url=cv.toDataURL('image/png'); SHOTS[key]=url; return url;
}
function shotUrl(c){ if(!c?.shot) return null; const i=INSTR[c.ins]; return screenshot(c.shot.seed,c.shot.tf,`${c.shot.nosym?'图表':i.sym} · ${c.shot.tf} · ${i.venue||''}`); }

// 标准图（前图/后图）：SVG，数据由后端提供，前端只负责绘制
function chartSVG(c,kind){
  const i=INSTR[c.ins]; const seed=(c.shot?.seed||5)*3+1; const preN=60, postN=kind==='post'?18:0;
  const bars=genBars(seed,preN+postN,i.price||100); const p0=bars[preN-1].c;
  const W=800,H=450,L=16,R=90,T=22,B=395; const vis=bars;
  const hi=Math.max(...vis.map(b=>b.h)), lo=Math.min(...vis.map(b=>b.l));
  const Y=v=>T+(hi-v)/(hi-lo)*(B-T); const bw=(W-L-R)/(preN+18);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" font-family="var(--font)" font-size="11">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)" />`; s+=`<text x="${W-R+8}" y="${Y(v)+4}" fill="var(--text3)" font-variant-numeric="tabular-nums">${fmtPrice(v,c.ins)}</text>`; }
  vis.forEach((b,idx)=>{ const x=L+idx*bw+bw/2; const up=b.c>=b.o; const col=up?'var(--up)':'var(--down)'; const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    s+=`<line x1="${x}" x2="${x}" y1="${Y(b.h)}" y2="${Y(b.l)}" stroke="${col}" stroke-width="1"/>`;
    s+=`<rect x="${x-bw*.3}" y="${y1}" width="${bw*.6}" height="${Math.max(1,y2-y1)}" fill="${up?'var(--surface)':col}" stroke="${col}" stroke-width="1"/>`; });
  const xs=L+(preN-1)*bw+bw/2;
  s+=`<line x1="${xs}" x2="${xs}" y1="${T}" y2="${B}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=`<rect x="${xs-22}" y="${T-16}" width="44" height="16" rx="4" fill="var(--accent)"/><text x="${xs}" y="${T-4}" text-anchor="middle" fill="#fff" font-weight="600">提交</text>`;
  if(c.thr?.ratio && (c.stance==='L'||c.stance==='S') && c.tpl!=='T5'){ const tv=p0*(1+(c.stance==='L'?1:-1)*c.thr.ratio); s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(tv)}" y2="${Y(tv)}" stroke="var(--realized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(tv)-4}" text-anchor="end" fill="var(--realized-text)" font-weight="600">阈值 ${fmtPrice(tv,c.ins)}</text>`; }
  if(c.s){ s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(c.s*p0/(i.price||1))}" y2="${Y(c.s*p0/(i.price||1))}" stroke="var(--unrealized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(c.s*p0/(i.price||1))+12}" text-anchor="end" fill="var(--unrealized-text)" font-weight="600">失效 ${fmtPrice(c.s,c.ins)}</text>`; }
  if(c.bound){ const bv=c.bound.price*p0/(i.price||1); s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(bv)}" y2="${Y(bv)}" stroke="var(--unrealized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(bv)+12}" text-anchor="end" fill="var(--unrealized-text)" font-weight="600">边界 ${fmtPrice(c.bound.price,c.ins)}</text>`; }
  if(kind==='post'){ const xe=L+(preN+postN-1)*bw+bw/2; s+=`<line x1="${xe}" x2="${xe}" y1="${T}" y2="${B}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3 3"/><text x="${xe}" y="${B+16}" text-anchor="middle" fill="var(--text2)" font-weight="600">${c.state==='pending'?'目前':'到期'}</text>`; }
  s+=`<text x="${L}" y="${B+16}" fill="var(--text3)">${c.shot?.tf||'4h'} × ${preN}${kind==='post'?` + ${postN}`:''} 根 · ${i.venue} 成交价</text>`;
  s+='</svg>'; return s;
}
</script>
<script>
/* =========================================================
   路由与导航
   ========================================================= */
const ROUTES = [
  {r:'find',t:'找回',i:'search'},
  {r:'review',t:'复盘',i:'review',cnt:()=>reviewCount()+gapCount()+verdictCount()},
  {r:'archive',t:'情境档案',i:'archive'},
  {r:'playbook',t:'打法版本',i:'play'},
];
function route(){ const h=location.hash.replace(/^#\/?/,''); const [name,...rest]=h.split('/'); return {name:name||'find',arg:rest.join('/')}; }
function go(path){ location.hash='#/'+path; }
function renderNav(){
  const cur=route().name;
  $('#nav').innerHTML=ROUTES.map(x=>`<a href="#/${x.r}" class="${cur===x.r||(x.r==='find'&&cur==='call')?'active':''}"><span class="ico">${ICONS[x.i]}</span>${x.t}${x.cnt&&x.cnt()?`<span class="cnt">${x.cnt()}</span>`:''}</a>`).join('');
  $('#nav2').innerHTML=`<a href="#/settings" class="${cur==='settings'?'active':''}"><span class="ico">${ICONS.gear}</span>设置</a>`;
  $('#mobilebar').innerHTML=ROUTES.map(x=>`<a href="#/${x.r}" class="${cur===x.r?'active':''}">${ICONS[x.i]}${x.t}</a>`).join('')+`<a href="#/settings" class="${cur==='settings'?'active':''}">${ICONS.gear}设置</a>`;
}
let FIND = {q:'',result:null,ins:null,tpl:null,path:null,tag:null,time:null};
function render(){
  const {name,arg}=route(); renderNav(); const m=$('#main'); closePops();
  const map={find:pageFind,call:()=>pageCall(arg),review:()=>pageReview(arg),archive:()=>pageArchive(arg),playbook:()=>pageEpisodeOrPlaybook(arg),episode:()=>pageEpisode(arg),settings:pageSettings};
  m.innerHTML=(map[name]||pageFind)(); m.scrollTop=0; bindPage();
}
function pageEpisodeOrPlaybook(arg){ return pagePlaybook(arg); }
window.addEventListener('hashchange',render);

/* ---------- 弹出菜单 ---------- */
function closePops(){ $$('.pop').forEach(p=>p.remove()); }
document.addEventListener('click',e=>{ if(!e.target.closest('.chip')) closePops(); });
function popMenu(anchor,items,onPick){
  closePops(); const p=document.createElement('div'); p.className='pop';
  p.innerHTML=items.map(it=>`<button class="${it.on?'on':''}" data-v="${esc(it.v)}"><span class="chk">${ICONS.check}</span>${esc(it.t)}</button>`).join('');
  p.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; e.stopPropagation(); onPick(b.dataset.v); closePops(); });
  anchor.appendChild(p);
}

/* =========================================================
   找回
   ========================================================= */
function filteredCalls(){
  const q=FIND.q.trim().toLowerCase();
  return CALLS.filter(c=>{
    const i=INSTR[c.ins];
    if(FIND.result && c.state!==FIND.result) return false;
    if(FIND.ins && c.ins!==FIND.ins) return false;
    if(FIND.tpl && c.tpl!==FIND.tpl) return false;
    if(FIND.path && c.path!==FIND.path) return false;
    if(FIND.tag && !c.tags.includes(FIND.tag)) return false;
    if(FIND.time){ const days=(NOW-new Date(c.at))/864e5; if(days>+FIND.time) return false; }
    if(q){ const hay=[c.words,c.tags.join(' '),i.sym,i.name,c.disp,STANCE[c.stance]||''].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>new Date(b.at)-new Date(a.at));
}
function chip(label,key,items,cur){
  const on=cur!=null; const curT=on?(items.find(x=>x.v===cur)?.t||cur):null;
  return `<span class="chip ${on?'on':''}" data-chip="${key}" role="button" tabindex="0">${on?`${label}：${esc(curT)}<span class="x" data-clear="${key}">${ICONS.close}</span>`:`${label}<span class="chev">${ICONS.chev}</span>`}</span>`;
}
function pageFind(){
  const list=filteredCalls();
  const anyFilter=Object.entries(FIND).some(([k,v])=>k!=='q'&&v);
  const chips=[
    chip('结果','result',Object.keys(STATE).filter(k=>k!=='waiting').map(k=>({v:k,t:STATE[k].t})),FIND.result),
    chip('品种','ins',Object.keys(INSTR).filter(k=>k!=='UNKNOWN').map(k=>({v:k,t:`${INSTR[k].name} ${INSTR[k].market}`})),FIND.ins),
    chip('时间','time',[{v:'1',t:'今天'},{v:'7',t:'最近 7 天'},{v:'30',t:'最近 30 天'},{v:'90',t:'最近 90 天'}],FIND.time),
    chip('口径','tpl',Object.keys(TPL).map(k=>({v:k,t:`${k} ${TPL[k]}`})),FIND.tpl),
    chip('形成路径','path',Object.keys(PATH).map(k=>({v:k,t:PATH[k]})),FIND.path),
    chip('标签','tag',Object.keys(SETS).map(k=>({v:k,t:k})),FIND.tag),
  ].join('');
  let body='';
  if(!list.length){
    body=`<div class="card empty"><div class="art">${ICONS.search}</div><div class="h3">没有找到符合条件的判断</div><div class="tip">${FIND.q?`原文、标签、品种里都没有「${esc(FIND.q)}」。`:'当前筛选条件下没有记录。'}试试去掉一个条件，或换一个同义词。</div><div style="margin-top:14px"><button class="btn tint sm" data-act="clearFilters">清除全部条件</button></div></div>`;
  } else {
    // 按行情段分带展示：连续同 episode 的卡片上方加一条轻带
    let lastEp=null;
    body=list.map(c=>{
      let band='';
      if(c.episode && c.episode!==lastEp){ const ep=EPISODES[c.episode]; const n=ep.calls.length; band=`<div class="epi-band"><span>${INSTR[ep.ins].name} · ${fmtDT(ep.anchor).replace(/ .*/,'')}起 行情段 · ${n} 条判断</span><span class="ln"></span><a href="#/episode/${c.episode}">查看行情链</a></div>`; }
      lastEp=c.episode||null;
      return band+resultCard(c);
    }).join('');
  }
  return `<div class="page">
    <div class="page-head"><h1 class="h1">找回<small>标签、原话、品种都能搜；结果按时间倒序，不按输赢排序</small></h1>
      <div class="row"><button class="btn" data-act="capture">${ICONS.plus}<span>记录判断</span></button></div></div>
    <div class="search">${ICONS.search}<input id="q" placeholder="搜原话、标签或品种，例如「回踩」「上影」「ETH」" value="${esc(FIND.q)}" autocomplete="off"><span class="kbd">⌘K</span></div>
    <div class="filters">${chips}${anyFilter?`<button class="btn ghost sm" data-act="clearFilters">清除</button>`:''}<span class="meta">${list.length} 条 · 时间倒序${FIND.result?` · 只看「${STATE[FIND.result].t}」`:''}</span></div>
    <div class="list" id="results">${body}</div>
    <div class="tip" style="margin-top:18px;text-align:center">${list.length? '每页 5 条完整卡片；统计使用完整集合，与本页无关':''}</div>
  </div>`;
}
function resultCard(c){
  const i=INSTR[c.ins]; const cs=critSummary(c); const url=shotUrl(c);
  const thumb=url?`<img class="thumb" src="${url}" alt="现场截图">`:`<div class="thumb none">${c.gap==='shot'?'没有现场图':'无截图'}</div>`;
  return `<article class="rcard" data-open="${c.id}" tabindex="0">
    ${thumb}
    <div>
      <div class="top">${stanceBadge(c.stance)}<span class="sym">${i.unknown?'<span class="muted">品种待确认</span>':i.sym}</span>${i.unknown?'':`<span class="mkt">${i.market}</span>`}<span class="faint">${PATH[c.path]}</span><span class="when">${fmtDT(c.at,{rel:true})}</span></div>
      <div class="q">${esc(c.words)}</div>
      <div class="tags"><span class="crit">${esc(cs.main)}${cs.sub?`<span class="sub">· ${esc(cs.sub)}</span>`:''}</span>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${c.epLink==='suggested'?`<span class="tag cold">归组待确认</span>`:''}</div>
    </div>
    <div class="side">${pill(c.state)}<div class="res">${resultLine(c)}</div><span class="id">${c.disp}</span></div>
  </article>`;
}

/* =========================================================
   判断卡详情
   ========================================================= */
let VIEW = {};
function pageCall(id){
  const c=CALLS.find(x=>x.id===id); if(!c) return `<div class="page"><div class="card empty"><div class="h3">这条判断不存在或已删除</div><a href="#/find">返回找回</a></div></div>`;
  const i=INSTR[c.ins]; const cs=critSummary(c); const url=shotUrl(c);
  const views=[]; if(url) views.push({k:'orig',t:'原图'}); if(c.pre && !i.nodata && !i.unknown) views.push({k:'pre',t:'前图'}); if(c.pre&&!i.nodata&&!i.unknown&&(c.state!=='pending'||c.obs)) views.push({k:'post',t:'后图'}); (c.followups||[]).forEach((f,n)=>views.push({k:'fu'+n,t:`补图 ${n+1}`}));
  if(!views.length) views.push({k:'none',t:'无图'});
  const vk=VIEW[id]&&views.some(v=>v.k===VIEW[id])?VIEW[id]:views[0].k;
  let stage='',foot='';
  if(vk==='orig'){ stage=`<div class="stage" data-zoom="${c.id}"><img src="${url}" alt="提交时的现场截图"><span class="badge">原图 · 用户所见</span><span class="cap">截图 ${c.shot.cap} · 提交 ${fmtDT(c.at)}</span></div>`; foot=`<span>${ICONS.zoom}</span><span>点击放大 · 保持原始比例，画线与时间轴完整</span><span class="gap">${c.shot.tf} · ${i.venue||'来源未知'}</span>`; }
  else if(vk==='pre'){ stage=`<div class="stage chart">${chartSVG(c,'pre')}<span class="badge">前图 · 系统标准图</span><span class="cap">数据截至 ${fmtDT(c.at)} · ${i.venue}</span></div>`; foot=`<span>${ICONS.info}</span><span>只用提交前已落库的数据；未收盘 K 线不参与 ATR</span><span class="gap">120 日线 + 60 根 ${c.shot?.tf||'4h'}</span>`; }
  else if(vk==='post'){ stage=`<div class="stage chart">${chartSVG(c,'post')}<span class="badge">后图 · ${c.state==='pending'?'截至目前':'到期'}</span><span class="cap">数据截至 ${c.obs?.asof||fmtDT(c.endAt)}</span></div>`; foot=`<span>${ICONS.info}</span><span>起点与前图相同，向右延展到${c.state==='pending'?'目前':'评价终点'}</span><span class="gap">${c.state==='pending'?'观察中':'已结算'}</span>`; }
  else if(vk.startsWith('fu')){ const f=c.followups[+vk.slice(2)]; const fu=screenshot(f.seed,'4h',`${i.sym} · 4h · 补图`); stage=`<div class="stage" data-zoomurl="${fu}"><img src="${fu}" alt="补图"><span class="badge">补图 · 事后上传</span><span class="cap">上传 ${f.at}</span></div>`; foot=`<span>${ICONS.info}</span><span>补图按实际上传时间标明身份，不当作提交时画面</span>`; }
  else { stage=`<div class="stage"><div class="empty"><div class="art">${ICONS.img}</div><div class="h3">这条判断没有图</div><div class="tip">${c.gap==='shot'?'采集时指定窗口失效，未截取无关桌面。':'该品种暂无行情，不生成标准图。'}</div><div style="margin-top:12px"><button class="btn sm" data-act="addShot" data-id="${c.id}">补一张截图</button></div></div></div>`; }

  // 结果区
  let resBlock='';
  const sixNote={realized:'按当时采用的口径，原预期兑现。',unrealized:'按当时采用的口径，原预期未兑现。',pending:'观察还没结束，先看市场怎么走。',not_triggered:'条件在有效窗口内没有出现，不算对也不算错。',no_criteria:'这条没有可检验的预期，只保留原话和市场观察。',insufficient_data:'缺少足够数据，暂时不能评价；不会用估算代替。'}[c.state];
  const stats=[];
  if(c.res?.end) stats.push({v:c.res.end,k:'到期变动',cls:c.res.end.startsWith('+')?'pos':'neg'});
  if(c.res?.mfe) stats.push({v:c.res.mfe,k:'最有利',cls:'pos'});
  if(c.res?.mae) stats.push({v:c.res.mae,k:'最不利',cls:'neg'});
  if(c.res?.amp) stats.push({v:c.res.amp+' ATR',k:'观察期振幅'});
  if(c.res?.low) stats.push({v:c.res.low,k:'观察期最低'});
  if(c.obs){ stats.push({v:c.obs.high,k:'最高（相对提交价）'},{v:c.obs.low,k:'最低'},{v:c.obs.end,k:c.obs.closed?'终点':'目前'}); }
  resBlock=`<section class="sec"><div class="sh"><h3 class="h3">市场怎么回答</h3>${pill(c.state,'lg')}</div>
    <div class="result-line"><span class="why">${resultLine(c)}</span></div>
    <div class="tip">${sixNote}${c.state==='insufficient_data'?' 接入美股行情后会自动补评，原提交时间不变。':''}${c.state==='no_criteria'&&c.obs?' 下方数值只是市场观察，不代表评分。':''}</div>
    ${stats.length?`<div class="stats">${stats.map(s=>`<div class="stat"><div class="v ${s.cls||''}">${esc(s.v)}</div><div class="k">${esc(s.k)}</div></div>`).join('')}</div>`:''}
    ${c.res?.first?`<div class="tip">首次达到阈值：${esc(c.res.first)}（只能确定在这根 K 线内）</div>`:''}
    ${c.state==='pending'?`<div class="row" style="margin-top:4px"><button class="btn sm tint" data-act="toggleRemind" data-id="${c.id}">${c.remind?'到期提醒：开':'到期提醒：关'}</button><span class="tip">默认不单条推送，周报里会合并</span></div>`:''}
  </section>`;

  // 行情链
  let chain='';
  if(c.episode){ const ep=EPISODES[c.episode]; const cs2=callsOfEpisode(c.episode);
    chain=`<section class="sec"><div class="sh"><h3 class="h3">同一段行情</h3><a href="#/episode/${c.episode}" class="tip">查看整段</a></div>
      <div class="chain">${cs2.map(x=>`<div class="it ${x.id===c.id?'cur':''} ${x.epLink==='suggested'?'sugg':''}"><span class="ln"><i></i></span><div class="t"><a href="#/call/${x.id}">${esc(x.words.slice(0,34))}${x.words.length>34?'…':''}</a><div class="w">${fmtDT(x.at)} · ${x.epLink==='suggested'?'建议归入，待确认':x.id===cs2[0].id?'首条 · 代表样本':'更新判断'}</div></div>${pill(x.state)}</div>`).join('')}</div>
      ${c.epLink==='suggested'?`<div class="note warn">${ICONS.link}<div>系统建议把这条并入 ${fmtDT(ep.anchor).replace(/ .*/,'')} 起的行情段（120 小时窗口内）。确认前它不参与去重统计。<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="confirmGroup" data-id="${c.id}">并入</button><button class="btn sm" data-act="rejectGroup" data-id="${c.id}">是新的一段</button></div></div></div>`:''}
    </section>`;
  } else {
    chain=`<section class="sec"><div class="sh"><h3 class="h3">同一段行情</h3></div><div class="tip">这条判断单独成段。可以手动关联另一条判断。</div><div><button class="btn sm tint" data-act="linkCall" data-id="${c.id}">关联判断…</button></div></section>`;
  }

  // 回看
  const rv=REVIEWS[c.id]||c.review;
  const vsText={keep:'沿用，无新增结论',did:'按打法做了',did_not:'没按打法做',new:'提出了新改法'};
  const reviewBlock=`<section class="sec"><div class="sh"><h3 class="h3">回看</h3>${rv?`<span class="faint">${rv.at||'刚刚'}</span>`:''}</div>
    ${rv?`<div class="quote">${esc(rv.note||vsText[rv.vs])}</div>${rv.note?`<div class="tip">${vsText[rv.vs]||''}</div>`:''}`:c.state==='pending'?`<div class="tip">到期后再回看。现在想到什么可以先补一句备注。</div><button class="btn sm tint" data-act="noteNow" data-id="${c.id}">补备注</button>`:`<div class="tip">还没回看。</div><div class="row"><button class="btn sm primary" data-act="reviewKeep" data-id="${c.id}">沿用，无新增结论</button><button class="btn sm" data-act="goReview" data-id="${c.id}">写回看</button></div>`}
  </section>`;

  // 打法引用
  const pbBlock=c.pb?(()=>{ const [n,v]=c.pb.split(':'); const ver=PLAYBOOKS[n].versions.find(x=>x.v===v); return `<section class="sec"><div class="sh"><h3 class="h3">打法</h3></div><div class="row"><a href="#/playbook/${encodeURIComponent(n)}" style="color:var(--text);font-weight:500">${esc(n)}</a><span class="ver ${ver.status}">${v}</span><span class="faint">计划采用</span></div><div class="tip">${esc(ver.change)}</div><div class="row"><span class="tag cold">执行：未知</span><span class="tip">导入真实交易后才会更新，不从盈亏反推</span></div></section>`; })():
    `<section class="sec"><div class="sh"><h3 class="h3">打法</h3></div><div class="tip">未引用打法版本。</div></section>`;

  const seen=c.seen?`<div class="tip">记录前查看过同类：检索会话 1 次（${c.seen.join('、')}）</div>`:'';

  return `<div class="page">
    <div class="crumb"><a href="#/find">找回</a><span class="sep">›</span><span>${i.unknown?'品种待确认':i.sym}</span><span class="sep">›</span><span class="mono">${c.disp}</span></div>
    <div class="page-head" style="align-items:center">
      <div class="row" style="gap:12px">${stanceBadge(c.stance)}<h1 class="h1" style="font-size:26px">${i.unknown?'品种待确认':i.sym}<small style="margin-top:3px">${i.unknown?'确认品种后可按原时间评价':i.market+' · '+i.venue} · ${PATH[c.path]} · 提交于 ${fmtDT(c.at)}</small></h1></div>
      <div class="row"><button class="btn sm" data-act="addShot" data-id="${c.id}">补图</button><button class="btn sm" data-act="more" data-id="${c.id}">更多…</button></div>
    </div>
    ${c.gap==='symbol'?`<div class="note warn" style="margin-bottom:16px">${ICONS.info}<div>截图窗口没识别出品种。确认后，这条会按原提交时间和当时的口径评价，原话不变。<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="fixSymbol" data-id="${c.id}">确认为 BTCUSDT 永续</button><button class="btn sm" data-act="fixSymbolOther" data-id="${c.id}">其他品种…</button></div></div></div>`:''}
    <div class="detail">
      <div class="col" style="gap:16px">
        <div class="viewer"><div class="bar"><div class="seg">${views.map(v=>`<button class="${v.k===vk?'on':''}" data-view="${v.k}" data-id="${c.id}">${v.t}</button>`).join('')}</div><div class="meta"><span class="kbd">←</span><span class="kbd">→</span><span>切换</span></div></div>${stage}<div class="foot">${foot}</div></div>
        <section class="sec"><div class="sh"><h3 class="h3">当时的原话</h3><span class="faint">${c.words.length} 字</span></div><div class="quote lg">${esc(c.words)}</div>
          <div class="row" style="flex-wrap:wrap;gap:6px">${c.tags.map(t=>`<span class="tag link" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}<button class="btn ghost sm" data-act="addTag" data-id="${c.id}">+ 标签</button></div>${seen}</section>
        <section class="sec"><div class="sh"><h3 class="h3">按什么规则评价</h3><span class="faint">提交时冻结</span></div>
          <div class="row" style="flex-wrap:wrap"><span class="crit">${esc(cs.main)}</span>${cs.sub?`<span class="tip">${esc(cs.sub)}</span>`:''}</div>
          <div class="timeline-mini">
            <div class="r"><span>口径</span><span>${c.tpl} ${TPL[c.tpl]}${c.tpl!=='T0'?`（${c.selectedBy==='explicit'?'手动选择':'默认口径，提交时已显示'}）`:''}</span></div>
            ${c.tpl!=='T0'?`<div class="r"><span>期限</span><span>${hzText(c.hz,c.ins)}，到 ${fmtDT(c.endAt)}${i.crypto?'（按自然小时）':'（按交易日收盘）'}</span></div>`:''}
            ${c.thr?`<div class="r"><span>阈值</span><span>${esc(thrText(c))}${c.thr.kind==='atr'?'，ATR 取提交时已完成日线':''}</span></div>`:''}
            ${c.s?`<div class="r"><span>失效价</span><span>${fmtPrice(c.s,c.ins)}，观察期内触及即未兑现（判断失效，不是仓位止损）</span></div>`:''}
            ${c.trig?`<div class="r"><span>触发</span><span>${esc(c.trig.cond)}，有效 ${c.trig.window}；触发后从触发价起算</span></div>`:''}
            <div class="r"><span>价格</span><span>${i.nodata?'美股行情未接入，暂无端点价':`${i.venue} ${i.market} 成交价，端点取不晚于该时刻的最新成交`}</span></div>
          </div>
        </section>
        ${chain}
      </div>
      <div class="col" style="gap:16px">
        ${resBlock}
        <section class="sec"><div class="sh"><h3 class="h3">实际行动</h3><span class="tag cold">未接入</span></div><div class="tip">连接交易所只读导入后，这里会显示对应成交点、数量与费用。判断评分不受此影响。</div></section>
        ${reviewBlock}
        ${pbBlock}
        <details class="disc card" style="padding:0 18px"><summary><span class="tri">${ICONS.tri}</span>技术详情</summary>
          <dl class="kv" style="padding:4px 0 16px">
            <dt>记录编号</dt><dd class="mono">${c.disp}</dd>
            <dt>截图时间</dt><dd>${c.shot?c.shot.cap:'—'}</dd>
            <dt>提交时间</dt><dd>${c.at.replace('T',' ').replace('+08:00',' (UTC+8)')}</dd>
            <dt>行情截至</dt><dd>${c.obs?.asof||(c.settledAt?fmtDT(c.settledAt):'—')}</dd>
            <dt>评价版本</dt><dd class="mono">criteria ${c.tpl}@1 · atr14@1 · calendar ${i.crypto?'crypto-utc@2':'nyse@4'} · price asof_last_eligible_trade</dd>
            <dt>数据完整性</dt><dd>${i.nodata?'无供应商覆盖':'覆盖 100%，无缺口'}</dd>
            <dt>结果版本</dt><dd>${c.settledAt?'original · 无数据订正':'—'}</dd>
          </dl></details>
      </div>
    </div>
  </div>`;
}

/* ---------- 行情段页 ---------- */
function pageEpisode(id){
  const ep=EPISODES[id]; if(!ep) return pageFind(); const i=INSTR[ep.ins]; const cs=callsOfEpisode(id);
  return `<div class="page">
    <div class="crumb"><a href="#/find">找回</a><span class="sep">›</span><span>行情段</span></div>
    <div class="page-head"><h1 class="h1">${i.sym} · ${fmtDT(ep.anchor).replace(/ .*/,'')}起的行情段<small>${i.market} · 自动归组窗口到 ${fmtDT(ep.until)} · ${cs.length} 条判断，首条为代表样本</small></h1></div>
    <div class="list">${cs.map(c=>resultCard(c)).join('')}</div>
    <div class="tip" style="margin-top:16px">一段行情里的多条判断在统计中算一次经验；后续改判列为「更新判断」，不会挑最准的那条。</div>
  </div>`;
}
</script>
<script>
/* =========================================================
   复盘工作区
   ========================================================= */
let RV = {seg:'due',cur:null,vs:null,note:'',better:''};
function dueCalls(){ return CALLS.filter(c=>c.due && !REVIEWS[c.id] && !c.review).sort((a,b)=>new Date(b.at)-new Date(a.at)); }
function pageReview(arg){
  if(arg && ['due','gaps','verdict'].includes(arg)) RV.seg=arg;
  const due=dueCalls(); const nDue=due.length, nGap=GAPS.length, nVer=verdictCount();
  const seg=`<div class="seg lg" id="rvseg">
    <button class="${RV.seg==='due'?'on':''}" data-seg="due">到期待复盘${nDue?` <span class="n">${nDue}</span>`:''}</button>
    <button class="${RV.seg==='gaps'?'on':''}" data-seg="gaps">待处理${nGap?` <span class="n">${nGap}</span>`:''}</button>
    <button class="${RV.seg==='verdict'?'on':''}" data-seg="verdict">裁决${nVer?` <span class="n">${nVer}</span>`:''}</button></div>`;
  let body='';
  if(RV.seg==='due') body=reviewDue(due);
  else if(RV.seg==='gaps') body=reviewGaps();
  else body=reviewVerdict();
  return `<div class="page"><div class="page-head"><h1 class="h1">复盘<small>每周日 18:00 汇总；平时随手处理，不必等周报</small></h1><div class="row">${seg}</div></div>${body}</div>`;
}
function reviewDue(due){
  if(!due.length) return `<div class="card empty"><div class="art">${ICONS.check}</div><div class="h3">到期的判断都回看过了</div><div class="tip">下一批到期：${fmtDT(CALLS.filter(c=>c.state==='pending').map(c=>c.endAt).sort()[0]||NOW)}。</div></div>`;
  if(!RV.cur || !due.some(c=>c.id===RV.cur)) RV.cur=due[0].id;
  // 按行情段分组
  const groups=[]; const seen=new Set();
  due.forEach(c=>{ const key=c.episode||('single-'+c.id); if(seen.has(key)) return; seen.add(key); groups.push({key,ep:c.episode?EPISODES[c.episode]:null,items:due.filter(x=>(x.episode||('single-'+x.id))===key)}); });
  const doneN=CALLS.filter(c=>c.due&&(REVIEWS[c.id]||c.review)).length, totalN=CALLS.filter(c=>c.due).length;
  const list=groups.map(g=>`<div class="qgroup">${g.ep?`<div class="gh">${INSTR[g.ep.ins].sym} · ${fmtDT(g.ep.anchor).replace(/ .*/,'')}起 行情段<span class="n">${g.items.length} 条</span><span class="ln"></span></div>`:''}${g.items.map(c=>{const u=shotUrl(c);return `<div class="qitem ${c.id===RV.cur?'on':''}" data-q="${c.id}">${u?`<img class="thumb" src="${u}" alt="">`:`<div class="thumb none">无图</div>`}<div><div class="q">${esc(c.words)}</div><div class="m">${stanceBadge(c.stance,true)}<span>${INSTR[c.ins].sym}</span><span>·</span><span>${fmtDT(c.at)}</span>${pill(c.state)}</div></div></div>`;}).join('')}</div>`).join('');
  const c=CALLS.find(x=>x.id===RV.cur); const i=INSTR[c.ins]; const cs=critSummary(c); const u=shotUrl(c);
  const canChart=c.pre&&!i.nodata;
  const pane=`<div class="rpane">
    <div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      <div class="row" style="justify-content:space-between"><div class="row">${stanceBadge(c.stance)}<b>${i.sym}</b><span class="mkt">${i.market}</span><span class="faint">${fmtDT(c.at)}</span></div>${pill(c.state,'lg')}</div>
      <div class="rimgs">
        <div class="im" ${u?`data-zoomurl="${u}"`:''}>${u?`<img src="${u}" alt="原图">`:`<div class="empty" style="padding:22px"><div class="tip">没有现场图</div></div>`}<span class="lb">原图 · ${c.shot?c.shot.cap:'—'}</span></div>
        <div class="im light">${canChart?chartSVG(c,'post'):`<div class="empty" style="padding:22px"><div class="tip">${i.nodata?'美股行情未接入':'无标准图'}</div></div>`}<span class="lb">后图 · 截至${c.obs?.asof||fmtDT(c.endAt)}</span></div>
      </div>
      <div class="quote">${esc(c.words)}</div>
      <div class="row" style="flex-wrap:wrap"><span class="crit">${esc(cs.main)}</span><span class="tip">${esc(cs.sub||'')}</span></div>
      <div class="result-line"><span class="why">${resultLine(c)}</span></div>
      <a href="#/call/${c.id}" class="tip">打开完整判断卡 →</a>
    </div>
    <div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px">
      <div class="sh"><h3 class="h3">这次怎么做的</h3><span class="faint">和当时的想法比</span></div>
      <div class="opts" id="rvopts">
        <button class="opt ${RV.vs==='did'?'on':''}" data-vs="did">按打法做了</button>
        <button class="opt ${RV.vs==='did_not'?'on':''}" data-vs="did_not">没按打法做</button>
        <button class="opt ${RV.vs==='na'?'on':''}" data-vs="na">没有交易</button>
      </div>
      <textarea class="textarea" id="rvnote" placeholder="回看几句：现在看，当时的判断哪里对、哪里不对？（可留空）">${esc(RV.note)}</textarea>
      <label class="field"><span>如果要改打法，改成什么？</span><input class="input" id="rvbetter" placeholder="例如：失效价放到前低下方 0.5 ATR" value="${esc(RV.better)}"></label>
      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <div class="row"><button class="btn primary" data-act="rvSave">保存回看<span class="kbd">R</span></button><button class="btn" data-act="rvKeep">沿用，无新增结论<span class="kbd">K</span></button></div>
        <span class="tip">${doneN} / ${totalN} 已回看</span>
      </div>
    </div>
  </div>`;
  return `<div class="review"><div>${list}</div>${pane}</div>`;
}
function reviewGaps(){
  if(!GAPS.length) return `<div class="card empty"><div class="art">${ICONS.check}</div><div class="h3">没有待处理的记录</div><div class="tip">品种、归组、缺图这类问题会出现在这里；不影响已有记录的评价。</div></div>`;
  const ic={symbol:ICONS.q,group:ICONS.link,shot:ICONS.img};
  return `<div class="list">${GAPS.map(g=>{const c=CALLS.find(x=>x.id===g.call);return `<div class="gapitem" data-gap="${g.id}"><div class="ic">${ic[g.kind]}</div><div class="b"><div class="t">${esc(g.t)}</div><div class="s">${esc(g.s)} · <a href="#/call/${c.id}">${esc(c.words.slice(0,22))}…</a></div></div><div class="acts">${
      g.kind==='symbol'?`<button class="btn sm primary" data-act="fixSymbol" data-id="${c.id}">确认为 BTCUSDT 永续</button><button class="btn sm" data-act="fixSymbolOther" data-id="${c.id}">其他…</button>`:
      g.kind==='group'?`<button class="btn sm primary" data-act="confirmGroup" data-id="${c.id}">并入</button><button class="btn sm" data-act="rejectGroup" data-id="${c.id}">新的一段</button>`:
      `<button class="btn sm primary" data-act="addShot" data-id="${c.id}">补图</button><button class="btn sm" data-act="skipGap" data-gapid="${g.id}">保持无图</button>`}</div></div>`;}).join('')}</div>
    <div class="tip" style="margin-top:14px">处理这些不会改变任何已计算的结果；确认品种或归组后，相关统计会在下次汇总时更新。</div>`;
}
function reviewVerdict(){
  const items=Object.keys(VERDICTS);
  return `<div class="list">${items.map(name=>{ const s=SETS[name]; const v=VERDICTS[name]; const pb=PLAYBOOKS[name];
    if(v) return `<div class="card" style="padding:18px 20px"><div class="sh"><h3 class="h3">${esc(name)}</h3><span class="tag">已裁决 · ${{evidence:'认定为经验',observe:'继续观察',drop:'不再当经验'}[v.d]}</span></div><div class="quote">${esc(v.reason||'未填写理由')}</div><div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="undoVerdict" data-name="${esc(name)}">撤回裁决</button></div></div>`;
    return `<div class="card" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px">
      <div class="sh"><h3 class="h3">${esc(name)} · 样本已到 ${s.reps} 段行情</h3><a href="#/archive/${encodeURIComponent(name)}" class="tip">看档案 →</a></div>
      <div class="tip">${s.n} 条判断，去掉同一段行情的重复后 ${s.reps} 段；达到 20 段就请你裁决一次。这只是提醒，不是系统结论。</div>
      <div class="stats" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><div class="v">${s.six.realized}<small style="font-size:14px;color:var(--text3)"> / ${s.six.realized+s.six.unrealized}</small></div><div class="k">兑现 / 有结论</div></div><div class="stat"><div class="v">${s.b1.rate}</div><div class="k">同期随机偏多参考</div></div><div class="stat"><div class="v pos">${s.mfe}</div><div class="k">最有利中位</div></div><div class="stat"><div class="v neg">${s.mae}</div><div class="k">最不利中位</div></div></div>
      ${pb?`<div class="note info">${ICONS.play}<div>当前打法 <b>${esc(name)}</b> ${pb.versions.find(x=>x.status==='adopted').v} 已采用；另有候选 ${pb.versions.filter(x=>x.status==='candidate').map(x=>x.v).join('、')||'无'}。裁决不会自动改版本。</div></div>`:''}
      <div class="opts" id="vdopts"><button class="opt ${RV.vd==='evidence'?'on':''}" data-vd="evidence">认定为经验</button><button class="opt ${RV.vd==='observe'?'on':''}" data-vd="observe">继续观察</button><button class="opt ${RV.vd==='drop'?'on':''}" data-vd="drop">不再当经验</button></div>
      <textarea class="textarea" id="vdreason" placeholder="写下理由，将来的你会想知道为什么这么定">${esc(RV.vdReason||'')}</textarea>
      <div class="row"><button class="btn primary" data-act="vdSave" data-name="${esc(name)}">记录裁决</button><span class="tip">保存后仍可撤回；20 段之后再有 20 段会再提醒一次</span></div>
    </div>`; }).join('')}
    ${!items.length?`<div class="card empty"><div class="h3">暂无需要裁决的经验</div></div>`:''}</div>`;
}

/* =========================================================
   情境档案
   ========================================================= */
let AR = {tag:'回踩缩量',expand:null,axisFilter:null};
const SIX = [['realized','兑现','var(--realized)'],['unrealized','未兑现','var(--unrealized)'],['pending','观察中','var(--pending)'],['not_triggered','未触发','var(--text4)'],['no_criteria','未设口径','transparent'],['insufficient_data','数据不足','repeating-linear-gradient(45deg,var(--text4) 0 2px,transparent 2px 5px)']];
function pageArchive(arg){
  if(arg){ const t=decodeURIComponent(arg); if(SETS[t]) AR.tag=t; }
  const s=SETS[AR.tag]; const cs=CALLS.filter(c=>c.tags.includes(AR.tag));
  const list=`<div class="taglist">${Object.keys(SETS).map(t=>`<div class="tagrow ${t===AR.tag?'on':''}" data-tag2="${esc(t)}">${SETS[t].verdict==='verdict_due'&&!VERDICTS[t]?'<span class="flag" title="待裁决"></span>':''}${esc(t)}<span class="n">${SETS[t].n}</span></div>`).join('')}</div>`;
  const total=Object.values(s.six).reduce((a,b)=>a+b,0);
  const bar=`<div class="sixbar">${SIX.map(([k,,col])=>{const n=s.six[k]; if(!n) return ''; const w=(n/total*100).toFixed(1); return `<i style="width:${w}%;background:${col};${k==='no_criteria'?'box-shadow:inset 0 0 0 1px var(--text4)':''}"></i>`;}).join('')}</div>
    <div class="sixleg">${SIX.map(([k,t,col])=>`<span data-six="${k}"><i style="background:${col};${k==='no_criteria'?'box-shadow:inset 0 0 0 1px var(--text4)':''}"></i>${t}<b>${s.six[k]}</b></span>`).join('')}</div>`;
  const concluded=s.six.realized+s.six.unrealized;
  const bigs=`<div class="bigs">
    <div class="big" data-expand="all"><div class="v">${s.n}<small>条</small></div><div class="k">判断记录</div><div class="u">${s.claims} 条原话 · ${s.episodes} 段行情${s.pendingGroup?` · ${s.pendingGroup} 条归组待确认`:''}</div></div>
    <div class="big" data-expand="concluded"><div class="v">${s.six.realized}<small>/ ${concluded}</small></div><div class="k">兑现 / 有结论</div><div class="u">${concluded?Math.round(s.six.realized/concluded*100)+'%':'—'} · 按行情段去重后 ${s.reps} 段</div></div>
    <div class="big" data-expand="mfe"><div class="v pos">${s.mfe}</div><div class="k">最有利 · 中位</div><div class="u">${s.mfe==='—'?'非方向类，不计':'相对提交价'}</div></div>
    <div class="big" data-expand="mae"><div class="v neg">${s.mae}</div><div class="k">最不利 · 中位</div><div class="u">${s.mae==='—'?'非方向类，不计':'相对提交价'}</div></div>
  </div>`;
  let members='';
  if(AR.expand){ const sub=AR.expand==='concluded'?cs.filter(c=>['realized','unrealized'].includes(c.state)):AR.expand==='six'?cs.filter(c=>c.state===AR.six):cs;
    members=`<div class="card" style="padding:14px 20px"><div class="sh"><h3 class="h3">${AR.expand==='six'?STATE[AR.six].t:AR.expand==='concluded'?'有结论的判断':'全部判断'} · 本页示例 ${sub.length} 条</h3><button class="btn ghost sm" data-act="collapse">收起</button></div>
      ${sub.length?sub.map(c=>`<a class="member" href="#/call/${c.id}">${stanceBadge(c.stance,true)}<span class="q">${esc(c.words)}</span>${pill(c.state)}<span class="d">${fmtDT(c.at)}</span></a>`).join(''):`<div class="tip">示例数据里没有这一类的记录；正式版会列出全部 ${s.n} 条中的成员。</div>`}
      <div class="tip" style="margin-top:8px">从统计数字回到每一条：数据集里统计的每个数字都能点开看是谁。</div></div>`; }
  const hist=`<div class="card" style="padding:18px 20px"><div class="sh"><h3 class="h3">最有利幅度分布</h3><span class="faint">按 ATR 倍数，只含有结论的判断</span></div>
    ${s.hist.some(x=>x)?`<div class="hist">${s.hist.map((n,idx)=>`<b style="height:${Math.max(3,n/Math.max(...s.hist)*100)}%" title="${n} 条"></b>`).join('')}</div><div class="hist-x"><span>&lt;0.5</span><span>0.5–1</span><span>1–1.5</span><span>1.5–2</span><span>2–3</span><span>&gt;3</span></div>`:`<div class="tip">非方向类口径不计最有利幅度。</div>`}</div>`;
  const b1=s.b1&&AR.tag!=='布林收口'?`<div class="card" style="padding:18px 20px"><div class="sh"><h3 class="h3">同期市场背景</h3><span class="faint">只作参考，不是对比评分</span></div>
    <div class="row" style="align-items:baseline;gap:12px"><span style="font-size:26px;font-weight:700;letter-spacing:-.02em">${s.b1.rate}</span><span class="tip">同一时期，随机时刻按同样口径（${esc(s.criteria)}）看多，会兑现的比例</span></div>
    <div class="tip" style="margin-top:6px">样本 ${s.b1.n} 个，${s.b1.range}${s.b1.missing?`，其中 ${s.b1.missing} 个因数据不足未计`:''}。只在方向到期类口径下给出。</div></div>`:'';
  const pb=s.pb&&PLAYBOOKS[s.pb]?(()=>{const p=PLAYBOOKS[s.pb]; const ad=p.versions.find(v=>v.status==='adopted'); const cand=p.versions.filter(v=>v.status==='candidate'); return `<div class="card" style="padding:18px 20px"><div class="sh"><h3 class="h3">打法</h3><a href="#/playbook/${encodeURIComponent(s.pb)}" class="tip">版本历史 →</a></div>
    <div class="pbrow"><div><b>${esc(s.pb)}</b><div class="tip">${esc(ad.change)}</div></div><span class="ver adopted">${ad.v} 采用中</span><span class="na">自 ${ad.at}</span><span class="na">计划样本 ${ad.samples.length}</span></div>

    `<div class="card" style="padding:18px 20px"><div class="sh"><h3 class="h3">打法</h3></div><div class="tip">这个情境还没有对应的打法。等有了稳定做法再写，不必现在就有。</div><button class="btn sm tint" data-act="newPb" data-tag="${esc(AR.tag)}">建立打法</button></div>`;
  const verdictNote=s.verdict==='verdict_due'&&!VERDICTS[AR.tag]?`<div class="note warn">${ICONS.scale}<div>样本已到 ${s.reps} 段行情，请你判断这条经验是否成立。<a href="#/review/verdict" style="margin-left:8px">去裁决</a></div></div>`:VERDICTS[AR.tag]?`<div class="note info">${ICONS.scale}<div>你的裁决：${{evidence:'认定为经验',observe:'继续观察',drop:'不再当经验'}[VERDICTS[AR.tag].d]}${VERDICTS[AR.tag].reason?` · ${esc(VERDICTS[AR.tag].reason)}`:''}</div></div>`:s.recheck?`<div class="note info">${ICONS.info}<div>最近 5 段行情里有 4 段未兑现，和此前的表现不一样了，值得再看一眼。</div></div>`:'';
  const wilson=`<details class="disc"><summary><span class="tri">${ICONS.tri}</span>统计口径</summary><div class="tech" style="padding:6px 0 4px;line-height:1.7">兑现比例按行情段去重（同一段只算首条）；区间估计 Wilson 95%：${concluded?wilsonText(s.six.realized,concluded):'—'}；观察中、未触发、未设口径与数据不足不进入分母。统计随汇总更新，本页示例数据虚构。</div></details>`;
  return `<div class="page">
    <div class="page-head"><h1 class="h1">情境档案<small>按标签看一类情境的经验；没有总分，没有排名</small></h1></div>

      <div class="col" style="gap:14px">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><h2 class="h2">${esc(AR.tag)}</h2><div class="tip">${s.range} · 常见口径 ${esc(s.criteria)}${s.excluded?` · 已排除 ${s.excluded} 条（品种待确认）`:''}</div></div><div class="row"><button class="btn sm" data-act="findTag" data-tag="${esc(AR.tag)}">在找回里查看</button></div></div>
        ${verdictNote}

        <div class="grid2">${hist}${b1}</div>
        ${pb}
        ${wilson}
      </div>
    </div></div>`;
}
function wilsonText(k,n){ const z=1.96,p=k/n; const d=1+z*z/n; const c=(p+z*z/(2*n))/d; const h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; return `${Math.round((c-h)*100)}%–${Math.round((c+h)*100)}%（n=${n}）`; }

/* =========================================================
   打法版本
   ========================================================= */
function pagePlaybook(arg){
  const names=Object.keys(PLAYBOOKS); const name=arg?decodeURIComponent(arg):names[0]; const p=PLAYBOOKS[name]; if(!p) return pageFind();
  const ad=p.versions.find(v=>v.status==='adopted');
  const cards=[...p.versions].reverse().map(v=>{
    const samples=(v.samples||[]).map(id=>CALLS.find(c=>c.id===id)).filter(Boolean);
    return `<div class="vcard ${v.status==='candidate'?'cand':''}">
      <div class="vh"><span class="ver ${v.status}">${v.v}${v.status==='adopted'?' 采用中':v.status==='candidate'?' 候选':v.status==='withdrawn'?' 已撤回':''}</span><span class="d">${v.at}${v.until?` – ${v.until}`:''}</span>${v.status==='candidate'?`<button class="btn sm primary" data-act="adopt" data-name="${esc(name)}" data-v="${v.v}">采用这一版</button>`:''}</div>
      <div class="body">
        <div class="wide"><span>改了什么</span><div style="font-size:14px;font-weight:500">${esc(v.change)}</div></div>
        ${v.old!=='—'?`<div><span>之前</span>${esc(v.old)}</div>`:''}
        <div><span>依据</span>${esc(v.basis)}</div>
        ${v.expect!=='—'?`<div><span>预期变化</span>${esc(v.expect)}</div>`:''}
        ${v.cost!=='—'?`<div><span>代价</span>${esc(v.cost)}</div>`:''}
        ${v.withdrawReason?`<div class="wide"><span>撤回原因</span>${esc(v.withdrawReason)}</div>`:''}
        <div class="wide"><span>计划采用这一版的判断</span>${samples.length?samples.map(c=>`<a class="member" href="#/call/${c.id}" style="grid-template-columns:auto 1fr auto auto auto">${stanceBadge(c.stance,true)}<span class="q">${esc(c.words)}</span>${pill(c.state)}<span class="tag cold">执行：未知</span><span class="d">${fmtDT(c.at)}</span></a>`).join(''):`<span class="tip">${v.status==='candidate'?'采用后，新记录可以引用它':'暂无引用'}</span>`}</div>
      </div></div>`; }).join('');
  return `<div class="page">
    <div class="page-head"><h1 class="h1">打法版本<small>记录你怎么做、为什么改；不从盈亏反推哪版更好</small></h1><div class="row"><div class="seg">${names.map(n=>`<button class="${n===name?'on':''}" data-pb="${esc(n)}">${esc(n)}</button>`).join('')}</div><button class="btn sm" data-act="newVersion" data-name="${esc(name)}">提出新版本</button></div></div>
    <div class="card" style="padding:18px 20px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between"><h2 class="h2">${esc(name)}</h2><span class="ver adopted">${ad.v} 采用中 · 自 ${ad.at}</span></div><div class="tip">适用范围：${esc(p.scope)}</div><div class="tip">关联情境：<a href="#/archive/${encodeURIComponent(name)}">${esc(name)}</a> · 判断评分与打法版本无关，改版本不会改动任何已有结果</div></div>
    <div class="vtimeline">${cards}</div></div>`;
}

<script>
/* =========================================================
   采集浮层
   ========================================================= */
let CAP = null; // {mode:'normal'|'noshot'|'noSymbol', text, stance, path, tpl, more, ime, saving, done}
function parseQuick(text){
  // 快捷语法：多/空/条件 · 72h/3d · 2%/1atr · s=失效价 · #标签 · 品种词
  const out={stance:null,hz:null,thr:null,s:null,tags:[],sym:null,ambig:[],free:[]};
  const t=text;
  if(/(看多|偏多|多头|做多|向上|反弹|站稳|(站上|回踩|回到|突破)[^，。；]*看\s*\d)/.test(t)) out.stance='L';
  if(/(看空|偏空|空头|做空|回落|向下|跌到|下探)/.test(t)) out.stance=out.stance?'?':'S';
  if(/(站上|跌破|突破).*(就|再)/.test(t)&&/(追|进|做)/.test(t)) out.stance='C';
  if(/不猜方向|方向不猜|大波动/.test(t)) out.ambig.push('波动类，建议 T5');
  const hz=t.match(/(\d+)\s*(小时|h|天|d|个交易日)/); if(hz){ const n=+hz[1]; out.hz=/小时|h/.test(hz[2])?`${n}h`:`${n}d`; }
  const th=t.match(/(\d+(?:\.\d+)?)\s*%/); if(th) out.thr={kind:'pct',ratio:+th[1]/100};
  const atr=t.match(/(\d+(?:\.\d+)?)\s*(个)?\s*atr/i); if(atr) out.thr={kind:'atr',a:+atr[1]};
  const s=t.match(/(?:跌破|失效|作废|s=)\s*([\d,\.]+k?)/i); if(s){ let v=s[1].replace(/,/g,''); if(/k$/i.test(v)) v=parseFloat(v)*1000; out.s=+v; }
  (t.match(/#([^\s#，。]+)/g)||[]).forEach(x=>out.tags.push(x.slice(1)));
  if(/回踩.*缩量|缩量.*回踩/.test(t)) out.tags.push('回踩缩量');
  if(/上影/.test(t)) out.tags.push('上影线'); if(/金叉/.test(t)) out.tags.push('金叉'); if(/收口/.test(t)) out.tags.push('布林收口');
  if(/ETH|以太/i.test(t)) out.sym='ETH-SPOT'; if(/BTC|比特/i.test(t)) out.sym='BTC-PERP'; if(/SOL/i.test(t)) out.sym='SOL-PERP'; if(/NVDA|英伟达/i.test(t)) out.sym='NVDA';
  if(/大概|可能|也许|感觉/.test(t)) out.free.push('语气不确定，按原话保存');
  out.tags=[...new Set(out.tags)];
  return out;
}
function openCapture(mode='normal'){
  if(CAP) return;
  CAP={mode,text:'',stance:null,path:'k',tpl:null,more:false,ime:false,saving:false,done:null,seed:40+Math.floor(Math.random()*20),tf:'4h',s:'',thrIn:'',hzIn:''};
  renderCapture(); setTimeout(()=>$('#capText')?.focus(),30);
}
function closeCapture(){ CAP=null; $('#layer').innerHTML=''; }
function capIns(){ if(CAP.mode==='noSymbol') return null; const p=parseQuick(CAP.text); return p.sym||'BTC-PERP'; }
function capTpl(p){ if(CAP.tpl) return CAP.tpl; const st=CAP.stance||p.stance; if(!st) return 'T0'; if(st==='C') return 'T3'; if(st==='?') return 'T5'; return (CAP.s||p.s)?'T2':'T1'; }
function renderCapture(){
  const L=$('#layer'); if(!CAP){ L.innerHTML=''; return; }
  const p=parseQuick(CAP.text); const ins=capIns(); const i=ins?INSTR[ins]:null; const st=CAP.stance||p.stance; const tpl=capTpl(p);
  const hz=CAP.hzIn||p.hz||(i&&!i.crypto?'3d':SET.hz); const thr=CAP.thrIn||(p.thr?(p.thr.kind==='pct'?`${(p.thr.ratio*100).toFixed(1)}%`:`${p.thr.a}×ATR14`):SET.thr); const s=CAP.s||p.s;
  const critText = tpl==='T0'?'未设口径 · 只保存原话与市场观察':tpl==='T3'?`触发后评价 · ${hzText(hz,ins)} · ${thr}`:tpl==='T5'?`振幅 ≥ 1.5×ATR14 · ${hzText(hz,ins)}`:tpl==='T4'?`边界不破 · ${hzText(hz,ins)}`:`${STANCE[st]} · ${hzText(hz,ins)} · ${thr}${tpl==='T2'&&s?` · 失效 ${fmtPrice(s,ins)}`:''}`;
  const shot = CAP.mode==='noshot'?`<div class="shot none">窗口失效<br>未截图</div>`:`<img class="shot" src="${screenshot(CAP.seed,CAP.tf,`${CAP.mode==='noSymbol'?'图表':(i?.sym||'')} · ${CAP.tf}`)}" alt="">`;
  const pk=[]; if(st) pk.push(`<span class="pk">${STANCE[st]}</span>`); if(p.hz||CAP.hzIn) pk.push(`<span class="pk">${hzText(hz,ins)}</span>`); if(p.thr||CAP.thrIn) pk.push(`<span class="pk">${thr}</span>`); if(s) pk.push(`<span class="pk">失效 ${fmtPrice(s,ins)}</span>`); p.tags.forEach(t=>pk.push(`<span class="pk">#${esc(t)}</span>`)); p.ambig.forEach(t=>pk.push(`<span class="pk ambig">${esc(t)}</span>`)); p.free.forEach(t=>pk.push(`<span class="pk free">${esc(t)}</span>`));
  let inner='';
  if(CAP.done){ const c=CAP.done;
    inner=`<div class="done"><div class="ck">${ICONS.check}</div><div style="flex:1"><div class="t">已记录 · ${c.disp}</div><div class="s">${c.tpl==='T0'?'未设口径，只保存原话与市场观察':`按「${esc(critSummary(c).main)}」评价，${fmtDue(c.endAt)}`}${CAP.mode==='noshot'?' · 没有现场图':''}</div></div><div class="row"><button class="btn sm" data-act="capSupplement">补充</button><button class="btn sm ghost" data-act="capUndo">撤回</button><a class="btn sm tint" href="#/call/${c.id}" data-act="capOpen">查看</a></div></div>`;
  } else {
    inner=`<div class="ph">${shot}<div class="ctx"><div class="r1">${i?`<span class="sym">${i.sym}</span><span class="mkt">${i.market}</span>`:`<span class="sym" style="color:var(--text2)">品种待确认</span><button class="btn sm ghost" data-act="capPickSym">选择品种</button>`}<span class="crit" title="提交时冻结，可在下方修改">${esc(critText)}</span></div><div class="win">${CAP.mode==='noshot'?'指定窗口已关闭，未截取其他内容 · 可稍后补图':`${i?.venue||'TradingView'} · ${CAP.tf} · 截图 ${fmtDT(NOW)}`}</div></div><button class="close" data-act="capClose" title="取消（Esc）">${ICONS.close}</button></div>
    <div class="pin"><textarea id="capText" placeholder="现在怎么看？直接写，例如「4h 回踩缩量，站稳 63k 看 66k，跌破 61,500 作废」" rows="2">${esc(CAP.text)}</textarea></div>
    <div class="parse">${pk.length?pk.join(''):`<span class="tip">写下后自动识别方向、期限、阈值、失效价和 #标签；识别不到就按原话保存</span>`}</div>
    <div class="ctrls">
      <div class="seg" title="方向">${[['L','看多'],['S','看空'],['C','条件'],['?','不猜方向']].map(([v,t])=>`<button class="${st===v?'on':''}" data-capst="${v}">${t}</button>`).join('')}</div>
      <div class="seg" title="怎么形成的">${[['k','图先'],['t','想先'],['kt','交织']].map(([v,t])=>`<button class="${CAP.path===v?'on':''}" data-cappath="${v}">${t}</button>`).join('')}</div>
      <div class="seg" title="口径">${['T0','T1','T2','T3','T4','T5'].map(v=>`<button class="${tpl===v?'on':''}" data-captpl="${v}" title="${TPL[v]}">${v}</button>`).join('')}</div>
      <button class="btn ghost sm more" data-act="capMore">${CAP.more?'收起':'更多'}</button>
    </div>

    <div class="pf"><span class="ime ${CAP.ime?'on':''}"><i></i>${CAP.ime?'输入法组字中，回车不会提交':'回车提交 · ⇧回车换行 · Esc 取消'}</span><div class="go"><span class="tip">${CAP.text.trim().length} 字</span><button class="btn primary" data-act="capSave" ${CAP.text.trim()?'':'disabled'}>记录<span class="kbd" style="background:rgba(255,255,255,.2);color:#fff;box-shadow:none">↩</span></button></div></div>`;
  }
  L.innerHTML=`<div class="ov" id="ov"><div class="ovwrap"><div class="panel ${CAP.saving?'saving':''}" role="dialog" aria-label="记录判断">${CAP.saving?'<div class="progress"><i></i></div>':''}${inner}</div>
    <div class="demo-states"><span>演示状态</span>${[['normal','正常'],['noshot','无现场图'],['noSymbol','品种未识别']].map(([v,t])=>`<button class="${CAP.mode===v?'on':''}" data-capmode="${v}">${t}</button>`).join('')}</div></div></div>`;
  const ta=$('#capText'); if(ta){ ta.style.height='auto'; ta.style.height=Math.min(260,ta.scrollHeight)+'px'; }
}
function capSave(){
  if(!CAP||CAP.saving||!CAP.text.trim()) return;
  CAP.saving=true; renderCapture();
  setTimeout(()=>{
    const p=parseQuick(CAP.text); const ins=capIns(); const i=ins?INSTR[ins]:INSTR.UNKNOWN; const st=CAP.stance||p.stance; const tpl=capTpl(p);
    const hz=CAP.hzIn||p.hz||(i.crypto?SET.hz:'3d'); const hn=hz.match(/(\d+)(h|d)/); const hours=hn?(+hn[1])*(hn[2]==='h'?1:24):72;
    let thr=null; if(CAP.thrIn){ const m=CAP.thrIn.match(/([\d.]+)\s*%/); thr=m?{kind:'pct',ratio:+m[1]/100}:{kind:'atr',a:parseFloat(CAP.thrIn)||1}; } else if(p.thr) thr=p.thr; else thr=SET.thr.includes('%')?{kind:'pct',ratio:parseFloat(SET.thr)/100}:{kind:'atr',a:parseFloat(SET.thr)||1};
    if(thr.kind==='atr'&&i.atr) thr.ratio=+(thr.a*i.atr/i.price).toFixed(3);
    const s=CAP.s?parseFloat(String(CAP.s).replace(/,/g,'')):p.s;
    const n=CALLS.filter(c=>c.at.startsWith('2026-09-09')).length+1;
    const c={id:'n'+Date.now(),disp:`C-20260909-${pad(n).padStart(3,'0')}`,ins:ins||'UNKNOWN',at:'2026-09-09T12:30:00+08:00',stance:tpl==='T0'?null:st,path:CAP.path,tpl,hz:tpl==='T0'?null:hz,thr:tpl==='T0'?null:thr,s:tpl==='T2'?s:null,
      words:CAP.text.trim(),tags:p.tags,state:tpl==='T0'?'no_criteria':i.nodata?'insufficient_data':'pending',reason:tpl==='T0'?'未设口径':i.nodata?'美股行情尚未接入':null,
      endAt:new Date(NOW.getTime()+hours*36e5).toISOString().replace('Z','+00:00'),shot:CAP.mode==='noshot'?null:{seed:CAP.seed,tf:CAP.tf,cap:fmtDT(NOW).replace(/^/,'2026-')},pre:!i.unknown&&!i.nodata,gap:CAP.mode==='noshot'?'shot':CAP.mode==='noSymbol'?'symbol':null,selectedBy:CAP.tpl?'explicit':'default',
      trig:tpl==='T3'?{cond:'1 分钟收盘触发',window:'24 小时',post:'L'}:null,bound:tpl==='T4'?{kind:'lower',price:i.price}:null,pb:p.tags.includes('回踩缩量')?'回踩缩量:v3':null};
    if(tpl==='T5') c.thr={kind:'atr',a:1.5,ratio:i.atr?+(1.5*i.atr/i.price).toFixed(3):null};
    if(tpl==='T0') c.obs={high:'—',low:'—',end:'—',asof:fmtDT(NOW)};
    CALLS.unshift(c);
    if(c.gap==='shot') GAPS.push({id:'g'+c.id,kind:'shot',call:c.id,t:'这条记录没有现场图',s:'采集时指定窗口失效，可补一张当时的截图（会标为补图）'});
    if(c.gap==='symbol') GAPS.push({id:'g'+c.id,kind:'symbol',call:c.id,t:'品种待确认',s:'截图窗口未识别出品种，确认后可按原时间与原口径评价'});
    if(c.pb){ const v=PLAYBOOKS['回踩缩量'].versions.find(x=>x.v==='v3'); v.samples.push(c.id); }
    CAP.saving=false; CAP.done=c; renderCapture(); $('#syncText').textContent='已同步 · 刚刚'; render();
  },650);
}

  const setb=t.closest('[data-set]'); if(setb){ SET[setb.dataset.set]=setb.dataset.v; if(setb.dataset.set==='theme') applyTheme(); render(); return; }
  const sw=t.closest('[data-sw]'); if(sw){ SET[sw.dataset.sw]=!SET[sw.dataset.sw]; render(); return; }
  // 采集浮层
  const cst=t.closest('[data-capst]'); if(cst){ CAP.stance=CAP.stance===cst.dataset.capst?null:cst.dataset.capst; CAP.tpl=null; renderCapture(); $('#capText')?.focus(); return; }
  const cpa=t.closest('[data-cappath]'); if(cpa){ CAP.path=cpa.dataset.cappath; renderCapture(); $('#capText')?.focus(); return; }
  const ctp=t.closest('[data-captpl]'); if(ctp){ CAP.tpl=ctp.dataset.captpl; renderCapture(); $('#capText')?.focus(); return; }
  const cmd=t.closest('[data-capmode]'); if(cmd){ CAP.mode=cmd.dataset.capmode; CAP.done=null; renderCapture(); $('#capText')?.focus(); return; }
  if(t.id==='ov'){ if(!CAP.text.trim()||CAP.done) closeCapture(); return; }
  const act=t.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act, id=act.dataset.id; const c=id?CALLS.find(x=>x.id===id):null;
  switch(a){
    case 'capture': openCapture(); break;
    case 'clearFilters': FIND={q:'',result:null,ins:null,tpl:null,path:null,tag:null,time:null}; render(); break;
    case 'addShot': { c.followups=c.followups||[]; c.followups.push({seed:50+c.followups.length,at:fmtDT(NOW),kind:'followup'}); if(c.gap==='shot'){ c.gap=null; GAPS=GAPS.filter(g=>g.call!==c.id||g.kind!=='shot'); } VIEW[c.id]='fu'+(c.followups.length-1); toast('已添加补图，标为事后上传'); if(route().name!=='call') go('call/'+c.id); else render(); break; }
    case 'fixSymbol': { c.ins='BTC-PERP'; c.gap=null; c.pre=true; c.shot&&(c.shot.nosym=false); GAPS=GAPS.filter(g=>!(g.call===c.id&&g.kind==='symbol')); if(c.tpl==='T0') c.obs={high:'+0.9%',low:'-0.4%',end:'+0.2%',asof:fmtDT(NOW)}; toast('已确认为 BTCUSDT 永续，按原时间评价'); render(); break; }

    case 'skipGap': GAPS=GAPS.filter(g=>g.id!==act.dataset.gapid); toast('保持无图'); render(); break;

    case 'reviewKeep': REVIEWS[c.id]={vs:'keep',at:fmtDT(NOW)}; toast('已记录：沿用，无新增结论'); render(); break;

    case 'rvSave': { const cur=CALLS.find(x=>x.id===RV.cur); REVIEWS[cur.id]={vs:RV.vs||'keep',note:RV.note.trim(),better:RV.better.trim(),at:fmtDT(NOW)}; if(RV.better.trim()&&cur.pb){ const [n]=cur.pb.split(':'); const p=PLAYBOOKS[n]; p.versions.push({v:'v'+(p.versions.length+1),status:'candidate',at:'2026-09-09',old:p.versions.find(v=>v.status==='adopted').change,change:RV.better.trim(),basis:cur.disp,expect:'—',cost:'—',samples:[]}); toast('回看已保存，改法已作为候选版本',{href:'#/playbook/'+encodeURIComponent(n),t:'查看'}); } else toast('回看已保存'); RV.vs=null;RV.note='';RV.better='';RV.cur=null; render(); break; }
    case 'rvKeep': { const cur=CALLS.find(x=>x.id===RV.cur); REVIEWS[cur.id]={vs:'keep',at:fmtDT(NOW)}; RV.vs=null;RV.note='';RV.better='';RV.cur=null; toast('已记录：沿用，无新增结论'); render(); break; }
    case 'vdSave': { if(!RV.vd){ toast('先选一个结论'); break; } VERDICTS[act.dataset.name]={d:RV.vd,reason:(RV.vdReason||'').trim(),at:fmtDT(NOW)}; RV.vd=null; RV.vdReason=''; toast('裁决已记录'); render(); break; }

document.addEventListener('keydown',e=>{
  const inField=['INPUT','TEXTAREA'].includes(e.target.tagName);
  // 全局
  if((e.ctrlKey&&e.shiftKey&&e.code==='KeyS')){ e.preventDefault(); openCapture(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(route().name!=='find') go('find'); setTimeout(()=>{$('#q')?.focus();$('#q')?.select();},20); return; }
  if(e.key==='Escape'){ if($('.lightbox')){ $('.lightbox').remove(); return; } if(CAP){ if(CAP.done) closeCapture(); else if(!CAP.text.trim()) closeCapture(); else if(confirm('放弃这条记录？')) closeCapture(); return; } closePops(); if(inField){ e.target.blur(); } return; }
  // 采集浮层
  if(CAP){ if(e.target.id==='capText'&&e.key==='Enter'&&!e.shiftKey){ if(e.isComposing||CAP.ime||SET.ime&&e.keyCode===229) return; e.preventDefault(); capSave(); } return; }
  if(inField) return;
  const r=route();
  if(r.name==='find'){ const cards=$$('.rcard'); if(!cards.length) return; let idx=cards.findIndex(x=>x===document.activeElement);
    if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); cards[Math.min(cards.length-1,idx+1)].focus(); }
    if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); cards[Math.max(0,idx-1)].focus(); }
    if(e.key==='Enter'&&idx>=0){ go('call/'+cards[idx].dataset.open); }
    if(e.key==='/'){ e.preventDefault(); $('#q')?.focus(); }
  }
  if(r.name==='call'){ const vs=$$('[data-view]'); const i=vs.findIndex(v=>v.classList.contains('on'));
    if(e.key==='ArrowRight'&&vs[i+1]) vs[i+1].click(); if(e.key==='ArrowLeft'&&vs[i-1]) vs[i-1].click();
    if(e.key==='Backspace'){ history.back(); } }
  if(r.name==='review'&&RV.seg==='due'){ const due=dueCalls(); const i=due.findIndex(c=>c.id===RV.cur);
    if(e.key==='j'&&due[i+1]){ RV.cur=due[i+1].id; RV.vs=null; render(); } if(e.key==='k'&&due[i-1]){ RV.cur=due[i-1].id; RV.vs=null; render(); }
    if(e.key.toLowerCase()==='k'&&e.shiftKey){ $('[data-act="rvKeep"]')?.click(); } if(e.key==='r'){ $('[data-act="rvSave"]')?.click(); } if(e.key==='K'){ $('[data-act="rvKeep"]')?.click(); }
    if(e.key==='Enter'&&RV.cur){ go('call/'+RV.cur); } }
});
