<title>Scorebook 记分簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* =========================================================
   Scorebook · 记分簿
   一本交易员的判断账簿：账页纸、蓝墨、印章、荧光笔。
   ========================================================= */
:root{
  --paper:#e9ede7; --sheet:#fbfcf9; --sheet2:#f3f5f0; --sheet3:#e6eae3;
  --ink:#17201c; --ink2:#4f5c56; --ink3:#83908a; --ink4:#b3bcb6;
  --rule:#d3dad2; --rule2:#bcc6bd; --rule3:#9eaaa1;
  --blue:#1f4e9c; --blue-ink:#173f80; --blue-soft:#e3ebf8; --blue-text:#1a4589;
  --hl:#fff1a3; --hl-text:#3e3300;
  --realized:#1e6b47; --realized-bg:#e2efe6; --unrealized:#b1352c; --unrealized-bg:#f7e4e1; --pending:#4b57b3; --pending-bg:#e6e7f7;
  --grey:#7d8983; --grey-bg:#e9ece9;
  --up:#1e6b47; --down:#b1352c;
  --font:"IBM Plex Sans","PingFang SC","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Instrument Serif","Songti SC","Noto Serif SC","STSong",serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  --shadow:0 1px 2px rgba(23,32,28,.06),0 0 0 1px var(--rule);
  --shadow-lift:0 12px 32px rgba(23,32,28,.12),0 2px 6px rgba(23,32,28,.06),0 0 0 1px var(--rule2);
  --shadow-pop:0 10px 30px rgba(23,32,28,.16),0 0 0 1px var(--rule2);
  --r:4px; --r2:8px;
  --w:1200px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#131614; --sheet:#1b1f1d; --sheet2:#212624; --sheet3:#2a302d;
  --ink:#e8ece7; --ink2:#aeb7b1; --ink3:#7d8882; --ink4:#535d58;
  --rule:#2b312e; --rule2:#39413d; --rule3:#4e5853;
  --blue:#7fa6e8; --blue-ink:#9dbcf0; --blue-soft:#1f2a3d; --blue-text:#a9c4f2;
  --hl:#4a4110; --hl-text:#ffe58a;
  --realized:#5cc08f; --realized-bg:#1a2e24; --unrealized:#ee8577; --unrealized-bg:#39211f; --pending:#9aa3ef; --pending-bg:#25284a;
  --grey:#8b958f; --grey-bg:#262b29; --up:#5cc08f; --down:#ee8577;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px var(--rule);
  --shadow-lift:0 16px 40px rgba(0,0,0,.5),0 0 0 1px var(--rule2);
  --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 0 0 1px var(--rule2);
}}
:root[data-theme="dark"]{
  --paper:#131614; --sheet:#1b1f1d; --sheet2:#212624; --sheet3:#2a302d;
  --ink:#e8ece7; --ink2:#aeb7b1; --ink3:#7d8882; --ink4:#535d58;
  --rule:#2b312e; --rule2:#39413d; --rule3:#4e5853;
  --blue:#7fa6e8; --blue-ink:#9dbcf0; --blue-soft:#1f2a3d; --blue-text:#a9c4f2;
  --hl:#4a4110; --hl-text:#ffe58a;
  --realized:#5cc08f; --realized-bg:#1a2e24; --unrealized:#ee8577; --unrealized-bg:#39211f; --pending:#9aa3ef; --pending-bg:#25284a;
  --grey:#8b958f; --grey-bg:#262b29; --up:#5cc08f; --down:#ee8577;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px var(--rule);
  --shadow-lift:0 16px 40px rgba(0,0,0,.5),0 0 0 1px var(--rule2);
  --shadow-pop:0 12px 32px rgba(0,0,0,.55),0 0 0 1px var(--rule2);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11"}
a{color:var(--blue-text);text-decoration:none} a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
svg{display:block}
::selection{background:var(--hl);color:var(--hl-text)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3);font-size:12px}
.tip{font-size:12.5px;color:var(--ink3);line-height:1.55}
.row{display:flex;align-items:center;gap:8px} .col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
mark{background:var(--hl);color:var(--hl-text);padding:0 1px;border-radius:2px}

/* ---------- 顶部账簿页眉 ---------- */
.masthead{position:sticky;top:0;z-index:40;background:var(--sheet);border-bottom:1px solid var(--rule2)}
.masthead::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--rule)}
.mast{max-width:var(--w);margin:0 auto;padding:0 32px;height:60px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:23px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand small{font-family:var(--font);font-size:11px;color:var(--ink3);letter-spacing:.14em;font-weight:500}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;gap:7px;padding:0 14px;height:60px;white-space:nowrap;flex:none;color:var(--ink2);font-weight:500;font-size:14px;position:relative;text-decoration:none}
.tabs a:hover{color:var(--ink)}
.tabs a.active{color:var(--ink)}
.tabs a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--blue)}
.tabs a .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hl);color:var(--hl-text);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mast .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{background:var(--sheet2);color:var(--ink)} .iconbtn svg{width:18px;height:18px}
.iconbtn.active{color:var(--blue)}
.searchbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:17px;border:1px solid var(--rule2);color:var(--ink3);font-size:13px;background:var(--sheet)}
.searchbtn:hover{border-color:var(--rule3);color:var(--ink2)} .searchbtn svg{width:15px;height:15px}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--realized)}

/* ---------- 版面 ---------- */
main{max-width:var(--w);margin:0 auto;padding:34px 32px 100px}
.page{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--rule2);position:relative}
.phead::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--rule)}
.h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h1 .lat{font-style:italic;color:var(--ink3);font-size:.62em;margin-left:10px;letter-spacing:0}
.sub{font-size:13px;color:var(--ink2);margin-top:8px;max-width:640px}
.h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.005em}
.h3{font-size:14px;font-weight:600;margin:0;letter-spacing:.01em}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.eyebrow.noline::after{display:none}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.crumb a{color:var(--ink2)} .crumb .sep{color:var(--ink4)}

/* ---------- 纸张 ---------- */
.sheet{background:var(--sheet);border-radius:var(--r2);box-shadow:var(--shadow)}
.sheet.pad{padding:20px 22px}
.sheet.flat{box-shadow:0 0 0 1px var(--rule)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet .sh .h3{display:flex;align-items:center;gap:8px}
.inset{background:var(--sheet2);border-radius:var(--r);padding:12px 14px}
.hr{height:1px;background:var(--rule);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- 原子 ---------- */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:4px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule2),0 1px 0 var(--rule2);font-family:var(--font);font-size:11px;color:var(--ink2);line-height:1;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s,transform .08s;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink)}
.btn:hover{background:var(--sheet2);box-shadow:inset 0 0 0 1px var(--rule3)} .btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:none} .btn.primary:hover{background:var(--blue-ink);color:#fff}
.btn.blue{background:var(--blue);color:#fff;box-shadow:none} .btn.blue:hover{background:var(--blue-ink)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)} .btn.ghost:hover{background:var(--sheet2);color:var(--ink)}
.btn.danger{color:var(--unrealized)} .btn.danger:hover{background:var(--unrealized-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;gap:5px}
.btn.lg{height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .kbd{margin-left:2px;margin-right:-4px} .btn.primary .kbd,.btn.blue .kbd{background:rgba(255,255,255,.18);box-shadow:none;color:inherit}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--sheet2);border-radius:6px;padding:2px;gap:1px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{height:26px;padding:0 11px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .12s;white-space:nowrap}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--rule2)}
.seg button:hover:not(.on){color:var(--ink)}
.seg.lg button{height:30px;padding:0 14px;font-size:13px}
.seg .n{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--hl);color:var(--hl-text);font-size:11px;font-weight:600;line-height:17px;text-align:center}

/* 印章：结算结果 */
.stamp{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:3px;font-weight:600;font-size:12px;letter-spacing:.08em;border:1.5px solid currentColor;white-space:nowrap;background:var(--sheet)}
.stamp.lg{height:30px;padding:0 13px;font-size:14px;letter-spacing:.12em;border-width:2px}
.stamp.st-realized{color:var(--realized);transform:rotate(-2deg)}
.stamp.st-unrealized{color:var(--unrealized);transform:rotate(-2deg)}
.stamp.st-pending{color:var(--pending);border-style:dashed;border-width:1.5px;font-weight:500;letter-spacing:.04em}
.stamp.st-not_triggered{color:var(--grey);border-style:dotted}
.stamp.st-no_criteria{color:var(--ink3);border-width:1px;font-weight:500;letter-spacing:.04em}
.stamp.st-insufficient_data{color:var(--ink3);border-width:1px;font-weight:500;letter-spacing:.04em;background:repeating-linear-gradient(135deg,var(--sheet) 0 4px,var(--sheet3) 4px 6px)}
.stamp.lg.st-realized,.stamp.lg.st-unrealized{transform:rotate(-3deg)}
.stamp.flat{transform:none!important}
/* 荧光笔：评价口径 */
.hl{display:inline;padding:1px 4px;background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:var(--hl-text);font-weight:500;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:2px;line-height:1.6}
.hl.soft{background:linear-gradient(transparent 12%,var(--sheet3) 12%,var(--sheet3) 88%,transparent 88%);color:var(--ink2)}
.hl .sub{color:var(--ink2);font-weight:400;margin-left:6px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--sheet2);color:var(--ink2);font-size:12px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--rule)}
.tag.link{cursor:pointer} .tag.link:hover{background:var(--blue-soft);color:var(--blue-text);box-shadow:inset 0 0 0 1px transparent}
.tag.cold{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--rule2);border-style:dashed}
.tag.warn{background:var(--hl);color:var(--hl-text);box-shadow:none}
.ver{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;font-family:var(--mono);font-size:11.5px;font-weight:500;background:var(--sheet2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--rule)}
.ver.adopted{background:var(--blue);color:#fff;box-shadow:none}
.ver.candidate{background:transparent;box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue-text)}
.ver.withdrawn{text-decoration:line-through;color:var(--ink3)}
.stance{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-family:var(--serif);font-size:14px;font-weight:600;color:#fff;background:var(--ink);flex:none;line-height:1}
.stance.L{background:var(--realized)} .stance.S{background:var(--unrealized)} .stance.C{background:var(--pending)} .stance.\?{background:var(--grey)}
.stance.soft{background:var(--sheet3);color:var(--ink2)}
.stance.none{background:transparent;box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink4)}
.mkt{font-size:11.5px;color:var(--ink3);padding:1px 6px;border-radius:3px;background:var(--sheet2)}
.quote{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);letter-spacing:.005em}
.quote.lg{font-size:22px;line-height:1.55}
.quote.sm{font-size:15px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);background:var(--sheet2);font-size:12.5px;line-height:1.55;color:var(--ink2);border-left:3px solid var(--rule2)}
.note>svg{flex:none;width:16px;height:16px;margin-top:1px}
.note.warn{background:var(--hl);color:var(--hl-text);border-left-color:#d8b93b}
.note.info{background:var(--blue-soft);color:var(--blue-text);border-left-color:var(--blue)}
.note .acts{display:flex;gap:6px;margin-top:8px}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px;background:#0f1218;box-shadow:0 0 0 1px var(--rule2)}
.thumb.none{display:flex;align-items:center;justify-content:center;background:var(--sheet2);color:var(--ink3);font-size:11px;text-align:center;line-height:1.35;padding:6px;background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 16px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink3);margin:0} .kv dd{margin:0;color:var(--ink2)}
.disc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);user-select:none;padding:10px 0}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary>svg{width:8px;height:8px;transition:transform .15s} .disc[open]>summary>svg{transform:rotate(90deg)}
.disc>summary:hover{color:var(--ink)}
.textarea{width:100%;min-height:84px;resize:vertical;padding:10px 12px;border-radius:var(--r);border:1px solid var(--rule2);background:var(--sheet);color:var(--ink);font-size:13.5px;line-height:1.55}
.textarea:focus,.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.input{height:34px;padding:0 11px;border-radius:var(--r);border:1px solid var(--rule2);background:var(--sheet);color:var(--ink);font-size:13.5px;width:100%}
.input::placeholder,.textarea::placeholder{color:var(--ink4)}
.field{display:flex;flex-direction:column;gap:5px} .field>span{font-size:12px;color:var(--ink2);font-weight:500}
.switch{width:36px;height:22px;border-radius:11px;background:var(--rule2);position:relative;transition:background .15s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch.on{background:var(--blue)} .switch.on::after{transform:translateX(14px)}
.empty{padding:48px 20px;text-align:center;color:var(--ink2)}
.empty .art{width:52px;height:52px;border-radius:50%;background:var(--sheet2);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--ink3)} .empty .art svg{width:22px;height:22px}
.empty .h3{color:var(--ink);margin-bottom:6px;font-family:var(--serif);font-size:18px;font-weight:500}

/* 弹出菜单 */
.popwrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--sheet);border-radius:var(--r2);box-shadow:var(--shadow-pop);padding:6px;z-index:60;animation:pop .12s ease}
.pop.right{left:auto;right:0}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.pop button,.pop a{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px;border-radius:4px;font-size:13px;text-align:left;color:var(--ink);text-decoration:none}
.pop button:hover,.pop a:hover{background:var(--sheet2)}
.pop button.on{color:var(--blue-text);font-weight:500}
.pop .chk{width:14px;height:14px;display:inline-flex;opacity:0} .pop button.on .chk{opacity:1} .pop .chk svg{width:14px;height:14px}
.pop .ph{padding:6px 9px 4px;font-size:11px;color:var(--ink3);letter-spacing:.08em}
.pop .sep{height:1px;background:var(--rule);margin:5px 0}

/* ---------- 找回：账页 ---------- */
.weekstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-radius:var(--r2);overflow:hidden;box-shadow:0 0 0 1px var(--rule);margin-bottom:22px}
.weekstrip a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;background:var(--sheet);color:var(--ink);text-decoration:none;transition:background .12s}
.weekstrip a:hover{background:var(--sheet2)}
.weekstrip .v{font-family:var(--serif);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.weekstrip .v small{font-family:var(--font);font-size:12px;color:var(--ink3);margin-left:4px}
.weekstrip .k{font-size:12px;color:var(--ink2)}
.weekstrip a.hot .v{color:var(--blue-text)}
.searchbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:var(--r2);background:var(--sheet);box-shadow:var(--shadow);margin-bottom:12px;transition:box-shadow .12s}
.searchbar:focus-within{box-shadow:0 0 0 1px var(--blue),0 0 0 4px var(--blue-soft)}
.searchbar svg{width:17px;height:17px;color:var(--ink3);flex:none}
.searchbar input{flex:1;border:0;background:transparent;font-size:15px;outline:none;font-family:var(--serif);font-size:17px;color:var(--ink)}
.searchbar input::placeholder{color:var(--ink4);font-family:var(--font);font-size:14px}
.searchbar .clr{display:none} .searchbar.has .clr{display:inline-flex}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:30px}
.filters .meta{margin-left:auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 11px;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule2);font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;user-select:none;position:relative;transition:all .12s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--rule3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.on.result{background:var(--blue);color:#fff}

function fmtDT(iso,opt={}){ const d=new Date(iso); const sh=new Date(d.getTime()+8*3600e3);
  const M=sh.getUTCMonth()+1,D=sh.getUTCDate(),h=pad(sh.getUTCHours()),m=pad(sh.getUTCMinutes());

  if(opt.rel){ const diff=(NOW-d)/36e5; if(diff<1) return `${Math.max(1,Math.round(diff*60))} 分钟前`; if(diff<24&&sh.getUTCDate()===today.getUTCDate()) return `今天 ${h}:${m}`; if(diff<48) return `昨天 ${h}:${m}`; }

function rng(seed){ let s=seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function genBars(seed,n,base){ const r=rng(seed); let p=base; const out=[]; let drift=0;
  for(let i=0;i<n;i++){ drift=drift*.9+(r()-.5)*.012; const o=p; const c=p*(1+drift+(r()-.5)*.018); const hi=Math.max(o,c)*(1+r()*.008); const lo=Math.min(o,c)*(1-r()*.008); out.push({o,h:hi,l:lo,c,v:.4+r()}); p=c; } return out; }
const SHOTS={};
function screenshot(seed,tf,label){
  const key=seed+'|'+tf; if(SHOTS[key]) return SHOTS[key];
  const W=1280,H=800,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  g.fillStyle='#131722'; g.fillRect(0,0,W,H);
  // 窗口标题栏
  g.fillStyle='#1b2030'; g.fillRect(0,0,W,44); g.fillStyle='#ff5f57'; g.beginPath(); g.arc(20,22,6,0,7); g.fill(); g.fillStyle='#febc2e'; g.beginPath(); g.arc(40,22,6,0,7); g.fill(); g.fillStyle='#28c840'; g.beginPath(); g.arc(60,22,6,0,7); g.fill();
  g.fillStyle='#9aa4b8'; g.font='500 15px -apple-system, Inter, sans-serif'; g.fillText(label||'',86,28);
  // 网格
  const L=40,R=1170,T=70,B=700; g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=1;
  for(let y=T;y<=B;y+=70){ g.beginPath(); g.moveTo(L,y); g.lineTo(R,y); g.stroke(); }
  for(let x=L;x<=R;x+=94){ g.beginPath(); g.moveTo(x,T); g.lineTo(x,B); g.stroke(); }
  const bars=genBars(seed,96,100); const hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l));
  const Y=v=>T+(hi-v)/(hi-lo)*(B-T-60)+20; const bw=(R-L)/bars.length;
  bars.forEach((b,i)=>{ const x=L+i*bw+bw/2; const up=b.c>=b.o; g.strokeStyle=g.fillStyle=up?'#26a69a':'#ef5350'; g.lineWidth=1; g.beginPath(); g.moveTo(x,Y(b.h)); g.lineTo(x,Y(b.l)); g.stroke(); const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c)); g.fillRect(x-bw*.32,y1,bw*.64,Math.max(1.5,y2-y1)); });
  // 成交量
  bars.forEach((b,i)=>{ const x=L+i*bw+bw/2; g.fillStyle=b.c>=b.o?'rgba(38,166,154,.35)':'rgba(239,83,80,.35)'; g.fillRect(x-bw*.32,B+10+(1-b.v/1.4)*70,bw*.64,b.v/1.4*70); });
  // 用户画线：一条趋势线与一条水平线
  const r=rng(seed+7); const y0=Y(lo+(hi-lo)*(.25+r()*.2)); g.strokeStyle='#f0b429'; g.lineWidth=2; g.setLineDash([]);
  g.beginPath(); g.moveTo(L+bw*10,y0+120); g.lineTo(R-bw*6,y0-30); g.stroke();
  const yh=Y(lo+(hi-lo)*(.42+r()*.1)); g.strokeStyle='#5d8cf9'; g.setLineDash([6,5]); g.beginPath(); g.moveTo(L,yh); g.lineTo(R,yh); g.stroke(); g.setLineDash([]);
  g.fillStyle='#5d8cf9'; g.fillRect(R,yh-11,70,22); g.fillStyle='#fff'; g.font='600 12px -apple-system, Inter, sans-serif'; g.fillText((lo+(hi-lo)*.47).toFixed(0)+'.0',R+8,yh+4);
  // 价格轴与时间轴
  g.fillStyle='#8b93a7'; g.font='12px -apple-system, Inter, sans-serif';
  for(let k=0;k<=6;k++){ const v=lo+(hi-lo)*k/6; g.fillText(v.toFixed(1),R+8,Y(v)+4); }
  for(let k=0;k<10;k++){ g.fillText(`${pad(1+k*3)}日`,L+k*(R-L)/10,B+100); }
  // 最新价标签
  const last=bars[bars.length-1]; g.fillStyle=last.c>=last.o?'#26a69a':'#ef5350'; g.fillRect(R,Y(last.c)-11,70,22); g.fillStyle='#fff'; g.font='600 12px -apple-system, Inter, sans-serif'; g.fillText(last.c.toFixed(1),R+8,Y(last.c)+4);
  const url=cv.toDataURL('image/png'); SHOTS[key]=url; return url;
}
function shotUrl(c){ if(!c?.shot) return null; const i=INSTR[c.ins]; return screenshot(c.shot.seed,c.shot.tf,`${c.shot.nosym?'图表':i.sym} · ${c.shot.tf} · ${i.venue||''}`); }

// 标准图（前图/后图）：SVG，数据由后端提供，前端只负责绘制
function chartSVG(c,kind){
  const i=INSTR[c.ins]; const seed=(c.shot?.seed||5)*3+1; const preN=60, postN=kind==='post'?18:0;
  const bars=genBars(seed,preN+postN,i.price||100); const p0=bars[preN-1].c;
  const W=800,H=450,L=16,R=90,T=22,B=395; const vis=bars;
  const hi=Math.max(...vis.map(b=>b.h)), lo=Math.min(...vis.map(b=>b.l));
  const Y=v=>T+(hi-v)/(hi-lo)*(B-T); const bw=(W-L-R)/(preN+18);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" font-family="var(--font)" font-size="11">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)" />`; s+=`<text x="${W-R+8}" y="${Y(v)+4}" fill="var(--text3)" font-variant-numeric="tabular-nums">${fmtPrice(v,c.ins)}</text>`; }
  vis.forEach((b,idx)=>{ const x=L+idx*bw+bw/2; const up=b.c>=b.o; const col=up?'var(--up)':'var(--down)'; const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    s+=`<line x1="${x}" x2="${x}" y1="${Y(b.h)}" y2="${Y(b.l)}" stroke="${col}" stroke-width="1"/>`;
    s+=`<rect x="${x-bw*.3}" y="${y1}" width="${bw*.6}" height="${Math.max(1,y2-y1)}" fill="${up?'var(--surface)':col}" stroke="${col}" stroke-width="1"/>`; });
  const xs=L+(preN-1)*bw+bw/2;
  s+=`<line x1="${xs}" x2="${xs}" y1="${T}" y2="${B}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=`<rect x="${xs-22}" y="${T-16}" width="44" height="16" rx="4" fill="var(--accent)"/><text x="${xs}" y="${T-4}" text-anchor="middle" fill="#fff" font-weight="600">提交</text>`;
  if(c.thr?.ratio && (c.stance==='L'||c.stance==='S') && c.tpl!=='T5'){ const tv=p0*(1+(c.stance==='L'?1:-1)*c.thr.ratio); s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(tv)}" y2="${Y(tv)}" stroke="var(--realized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(tv)-4}" text-anchor="end" fill="var(--realized-text)" font-weight="600">阈值 ${fmtPrice(tv,c.ins)}</text>`; }
  if(c.s){ s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(c.s*p0/(i.price||1))}" y2="${Y(c.s*p0/(i.price||1))}" stroke="var(--unrealized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(c.s*p0/(i.price||1))+12}" text-anchor="end" fill="var(--unrealized-text)" font-weight="600">失效 ${fmtPrice(c.s,c.ins)}</text>`; }
  if(c.bound){ const bv=c.bound.price*p0/(i.price||1); s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(bv)}" y2="${Y(bv)}" stroke="var(--unrealized)" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R-4}" y="${Y(bv)+12}" text-anchor="end" fill="var(--unrealized-text)" font-weight="600">边界 ${fmtPrice(c.bound.price,c.ins)}</text>`; }
  if(kind==='post'){ const xe=L+(preN+postN-1)*bw+bw/2; s+=`<line x1="${xe}" x2="${xe}" y1="${T}" y2="${B}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3 3"/><text x="${xe}" y="${B+16}" text-anchor="middle" fill="var(--text2)" font-weight="600">${c.state==='pending'?'目前':'到期'}</text>`; }
  s+=`<text x="${L}" y="${B+16}" fill="var(--text3)">${c.shot?.tf||'4h'} × ${preN}${kind==='post'?` + ${postN}`:''} 根 · ${i.venue} 成交价</text>`;
  s+='</svg>'; return s;
}
/* 口径的白话句子：让交易员一眼看懂这条会怎么被评价 */
function critSentence(c){

const FIND={q:'',states:[],ins:null,stance:null,tag:null,sort:'desc',group:false,cursor:-1,pop:null};

<script>
/* =========================== 复盘 =========================== */
const RV={sel:null,vs:null,note:'',better:'',pop:null};
function dueCalls(){ return CALLS.filter(c=>c.due&&!REVIEWS[c.id]).sort((a,b)=>(a.settledAt||a.endAt||'').localeCompare(b.settledAt||b.endAt||'')); }
function queueItems(){ const q=[]; dueCalls().forEach(c=>q.push({kind:'call',id:c.id})); GAPS.forEach(g=>q.push({kind:'gap',id:g.id})); Object.entries(VERDICTS).filter(([k,v])=>v===null).forEach(([k])=>q.push({kind:'verdict',id:k})); return q; }
function ensureSel(arg){
  const q=queueItems();

    <div class="vh"><span class="ver ${v.status}">${v.v}</span><span class="faint">${stLabel[v.status]}</span><span class="d">${v.at}${v.until?` – ${v.until}`:''}</span>${v.status==='candidate'?`<div class="col" style="gap:6px;margin-top:6px"><button class="btn sm primary" data-act="adopt" data-v="${v.v}">采纳为现行</button><button class="btn sm ghost" data-act="withdraw" data-v="${v.v}">撤回</button></div>`:''}</div>
    <div class="body"><div class="wide"><span>改了什么</span><div class="chg">${esc(v.change)}</div></div><div><span>原来</span>${esc(v.old)}</div><div><span>依据</span>${esc(v.basis)}</div><div><span>期望</span>${esc(v.expect)}</div><div><span>代价</span>${esc(v.cost)}</div>${v.withdrawReason?`<div class="wide"><span>为什么撤回</span>${esc(v.withdrawReason)}</div>`:''}${v.samples?`<div class="wide"><span>采纳后的样本</span>${v.samples.length?v.samples.map(id=>{const c=CALLS.find(x=>x.id===id); return c?`<a href="#/call/${c.id}" class="tag link" style="margin-right:6px">${c.disp} · ${STATE[c.state].t}</a>`:'';}).join(''):'<span class="faint">还没有新判断用到它</span>'}</div>`:''}</div>
  </div>`;
  const form=PB.form?`<div class="form-sheet"><div class="sh"><span class="h3">在 ${adopted?.v||'当前'} 的基础上提一个新版本</span><span class="faint">先当候选，采纳后才生效</span></div>
    <div class="field"><span>改了什么</span><input class="input" id="pbChange" placeholder="一句话说清楚改动" value="${esc(PB.form.change||'')}"></div>
    <div class="grid2"><div class="field"><span>原来是怎样</span><input class="input" id="pbOld" value="${esc(PB.form.old||adopted?.change||'')}"></div><div class="field"><span>依据（哪几条判断）</span><input class="input" id="pbBasis" placeholder="C-2026…" value="${esc(PB.form.basis||'')}"></div><div class="field"><span>期望改善</span><input class="input" id="pbExpect"></div><div class="field"><span>可能的代价</span><input class="input" id="pbCost"></div></div>
    <div class="row"><button class="btn primary" data-act="pbSubmit">存为候选版本</button><button class="btn ghost" data-act="pbCancel">取消</button></div></div>`:'';
  const newPb=PB.newPb?`<div class="form-sheet"><div class="sh"><span class="h3">新建一套打法</span></div><div class="grid2"><div class="field"><span>名字</span><input class="input" id="npName" placeholder="比如：布林收口"></div><div class="field"><span>适用范围</span><input class="input" id="npScope" placeholder="什么情况下用，什么情况下不用"></div></div><div class="field"><span>v1 的做法</span><input class="input" id="npChange"></div><div class="row"><button class="btn primary" data-act="npSubmit">建立</button><button class="btn ghost" data-act="npCancel">取消</button></div></div>`:'';
  return `<div class="phead"><div><h1 class="h1">打法版本<span class="lat">Playbook</span></h1><div class="sub">每一次改做法都留下来：改了什么、为什么改、付出了什么代价。版本可以撤回，不可以偷偷改。</div></div><button class="btn" data-act="newPb">${ICONS.plus}新建打法</button></div>
  ${newPb}
  <div class="archive" style="grid-template-columns:250px minmax(0,1fr)">
    <div class="taglist">${names.map(n=>{const p=PLAYBOOKS[n]; const a=p.versions.find(v=>v.status==='adopted'); const cand=p.versions.some(v=>v.status==='candidate'); return `<div class="tagrow ${n===PB.cur?'on':''}" data-go="playbook/${encodeURIComponent(n)}">${cand?'<span class="flag" title="有候选版本"></span>':''}${esc(n)}<span class="n" style="font-family:var(--mono);font-size:11.5px">${a?a.v:'—'}</span></div>`;}).join('')}</div>
    <div class="stack">
      <div class="sheet pad"><div class="sh" style="align-items:flex-start"><div><h2 class="h2">${esc(PB.cur)}</h2><div class="sentence" style="font-size:15px;margin-top:8px;color:var(--ink2)">${esc(pb.scope)}</div></div><div class="col" style="align-items:flex-end;gap:6px">${adopted?`<span class="ver adopted">${adopted.v} 现行</span><span class="faint">自 ${adopted.at}</span>`:''}</div></div>
        <div class="hr"></div>
        <div class="row" style="justify-content:space-between"><span class="tip">${pb.versions.length} 个版本 · ${pb.versions.filter(v=>v.status==='withdrawn').length} 次撤回${SETS[PB.cur]?` · 对应情境 <a href="#/archive/${encodeURIComponent(PB.cur)}">#${esc(PB.cur)}</a>`:''}</span><button class="btn sm" data-act="newVersion">${ICONS.plus}提新版本</button></div>
      </div>
      ${form}
      <div class="vtimeline">${vs.map(vcard).join('')}</div>
    </div>
  </div>`;
}

function applyTheme(){ const r=document.documentElement; if(SET.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',SET.theme); }
function pageSettings(){

      <div class="srow"><div class="l"><b>条件触发</b><span>「站上」「跌破」的确认方式</span></div><span class="hl">1 分钟收盘</span></div>
      <div class="srow"><div class="l"><b>波动扩大</b><span>「必有大波动」的门槛</span></div><span class="hl">1.5 × ATR14</span></div>

    </div>
    <div class="sgroup"><div class="gt">提醒</div>

      <div class="srow"><div class="l"><b>每周对账</b><span>周日 18:00 汇总本周到期、待补、待裁决</span></div><span class="switch ${SET.weekly?'on':''}" data-act="toggle" data-k="weekly" role="switch" aria-checked="${SET.weekly}"></span></div>
    </div>
    <div class="sgroup"><div class="gt">采集</div>
      <div class="srow"><div class="l"><b>快捷键</b><span>任何窗口下按它，先截图再说话</span></div><span class="kbd" style="height:26px;padding:0 10px;font-size:13px">${SET.hotkey}</span></div>
      <div class="srow"><div class="l"><b>截图范围</b><span>当前活动窗口；识别失败会让你确认品种</span></div><span class="faint">活动窗口</span></div>
    </div>
    <div class="sgroup"><div class="gt">数据</div>
      <div class="srow"><div class="l"><b>导出账簿</b><span>原图、原话、口径、结果，一份不加工的副本</span></div><button class="btn sm" data-act="export">导出</button></div>
      <div class="srow"><div class="l"><b>行情源</b><span>币安 成交价 · 美股行情尚未接入</span></div><span class="sync"><i></i>已同步 · 12:29</span></div>
    </div>
  </div>`;
}

<script>
/* =========================== 采集浮层 =========================== */
const CAP={open:false,text:'',ins:'BTC-PERP',demo:'normal',stance:null,hz:null,thr:null,s:null,tags:'',more:false,saving:false,done:null,ime:false,pop:null};
function parseQuick(t){
  const r={stance:null,hz:null,thr:null,s:null,tags:[],tpl:null,free:false};
  if(!t.trim()) return r;
  r.tags=[...t.matchAll(/#([\p{L}\p{N}_]+)/gu)].map(m=>m[1]);
  const L=/(看多|偏多|多头|做多|向上|反弹|站稳|(站上|回踩|回到|突破)[^，。；]*看\s*\d)/, S=/(看空|偏空|空头|做空|回落|向下|跌到|下探)/;
  const cond=/(要是|如果|站上.*就|跌破.*就)/, bound=/(不破|不过|地板|天花板)/, vol=/(大波动|振幅|方向不猜|收口)/;
  if(cond.test(t)) { r.stance='C'; r.tpl='T3'; }
  else if(bound.test(t)) { r.tpl='T4'; }
  else if(vol.test(t)) { r.stance='?'; r.tpl='T5'; }
  else if(L.test(t)&&!S.test(t)) { r.stance='L'; r.tpl='T1'; }
  else if(S.test(t)&&!L.test(t)) { r.stance='S'; r.tpl='T1'; }
  const hz=t.match(/(\d+)\s*小时/)||t.match(/(\d+)\s*[hH](?=\s*(内|后|之内|看))/); const dd=t.match(/(\d+)\s*(天|日|个交易日)/);
  if(hz) r.hz=hz[1]+'h'; else if(dd) r.hz=(INSTR[CAP.ins]?.crypto?+dd[1]*24+'h':dd[1]+'d');
  const pct=t.match(/(\d+(?:\.\d+)?)\s*%/); if(pct) r.thr={kind:'pct',ratio:+pct[1]/100};
  const inv=t.match(/(跌破|涨破|失效|作废)[^\d]{0,12}?(\d[\d,\.]*)\s*(k|K)?/); if(inv){ let v=parseFloat(inv[2].replace(/,/g,'')); if(inv[3]) v*=1000; r.s=v; if(r.tpl==='T1'&&r.stance) r.tpl='T2'; }
  if(!r.tpl) { r.tpl='T0'; r.free=true; }
  return r;
}
function capInsOf(){ return CAP.demo==='nosym'?'UNKNOWN':CAP.ins; }
function capParsed(){ const p=parseQuick(CAP.text); if(CAP.stance) { p.stance=CAP.stance; if(p.tpl==='T0') p.tpl='T1'; } if(CAP.hz) p.hz=CAP.hz; if(CAP.thr) p.thr=CAP.thr; if(CAP.s!=null) { p.s=CAP.s; if(p.tpl==='T1') p.tpl='T2'; } if(CAP.tags) p.tags=[...new Set([...p.tags,...CAP.tags.split(/[,，\s]+/).filter(Boolean).map(x=>x.replace(/^#/,''))])]; return p; }
function capPreviewCall(){ const p=capParsed(); const ins=capInsOf(); const i=INSTR[ins]; const hz=p.hz||(i.crypto?SET.cryptoHz:SET.usHz); const thr=p.thr||{kind:'atr',a:p.tpl==='T5'?1.5:1,ratio:i.atr&&i.price?(p.tpl==='T5'?1.5:1)*i.atr/i.price:null}; return {ins,tpl:p.tpl,stance:p.stance,hz,thr,s:p.s,words:CAP.text,tags:p.tags,trig:p.tpl==='T3'?{cond:'条件（1 分钟收盘确认）',window:'24 小时',post:'L'}:null,bound:p.tpl==='T4'?{kind:'lower',price:i.price?Math.round(i.price*0.97):0}:null,parsed:p}; }
function renderCapture(){
  const layer=$('#layer'); if(!CAP.open){ layer.innerHTML=''; return; }
  const ins=capInsOf(); const i=INSTR[ins]; const pv=capPreviewCall(); const p=pv.parsed;
  const shot=CAP.demo==='noshot'?`<div class="shot none">未抓到<br>活动窗口</div>`:`<img class="shot" src="${screenshot(42,'4h',`${CAP.demo==='nosym'?'图表':i.sym} · 4h`)}" alt="现场图">`;
  const winTxt=CAP.demo==='noshot'?'截图失败 · 这条会标为「缺现场图」':CAP.demo==='nosym'?'TradingView — 未识别出品种，保存后需确认':`TradingView — ${i.sym} · 4h · ${i.venue}`;
  const chips=[]; if(CAP.text.trim()){
    chips.push(p.stance?`<span class="pk"><span class="k">表态</span>${STANCE[p.stance]}</span>`:`<span class="pk ambig" data-act="capPickStance">表态未识别 · 点此指定</span>`);
    chips.push(`<span class="pk"><span class="k">期限</span>${hzText(pv.hz,ins)}${p.hz?'':'<span class="k">（默认）</span>'}</span>`);
    if(p.tpl!=='T0'&&p.tpl!=='T4') chips.push(`<span class="pk"><span class="k">阈值</span>${pv.thr.kind==='pct'?(pv.thr.ratio*100).toFixed(1)+'%':pv.thr.a+'×ATR14'}${p.thr?'':'<span class="k">（默认）</span>'}</span>`);
    if(pv.s) chips.push(`<span class="pk"><span class="k">失效</span>${fmtPrice(pv.s,ins)}</span>`);
    chips.push(`<span class="pk"><span class="k">模板</span>${TPL[p.tpl]}</span>`);
    pv.tags.forEach(t=>chips.push(`<span class="pk">#${esc(t)}</span>`));
    if(p.free) chips.push(`<span class="pk free">没识别出方向，将按「不设口径」保存，不判对错</span>`);
  } else chips.push(`<span class="faint">写完会在这里显示这条会按什么口径评价。写法随意，比如「站稳 63k 看 66k，跌破 61500 作废」。</span>`);
  let inner;
  if(CAP.done){ const c=CAP.done; inner=`<div class="done"><div class="stampbig">已入账</div><div><div class="t">${INSTR[c.ins].sym} · ${fmtDT(c.at,{rel:true})}</div><div class="s">${critSentence(c)}${c.gap==='symbol'?'<br>品种还没确认，评价会等你确认后再开始。':''}${c.gap==='shot'?'<br>没有现场图，你可以稍后补一张。':''}</div><div class="acts"><a class="btn primary" href="#/call/${c.id}" data-act="capClose">打开判断卡</a><button class="btn" data-act="capAgain">再记一条</button><button class="btn ghost" data-act="capClose">关闭<span class="kbd">Esc</span></button></div></div></div>`; }
  else inner=`<div class="ph">${shot}<div class="ctx"><div class="r1"><span class="popwrap"><button class="sym" data-act="capSymMenu" title="换品种">${i.sym} ${ICONS.chev}</button>${CAP.pop==='sym'?`<div class="pop"><div class="symlist">${Object.keys(INSTR).filter(k=>k!=='UNKNOWN').map(k=>`<button data-act="capPickSym" data-v="${k}"><b>${INSTR[k].sym}</b><span>${INSTR[k].market}</span></button>`).join('')}</div></div>`:''}</span><span class="mkt">${i.market}</span><span class="faint">${fmtDT(NOW.toISOString(),{rel:true})}</span></div><div class="win">${winTxt}</div>${CAP.text.trim()&&!p.free?`<div class="sentence" style="font-size:13.5px;color:var(--ink2)">${critSentence(pv)}</div>`:''}</div><button class="close" data-act="capClose" title="关闭（Esc）">${ICONS.close}</button></div>
    <div class="pin"><textarea id="capText" placeholder="现在看到什么、怎么想的，直接说。" rows="2">${esc(CAP.text)}</textarea></div>
    <div class="parse">${chips.join('')}</div>
    <div class="ctrls"><span class="lbl">表态</span><span class="seg">${['L','S','?','C'].map(k=>`<button class="${(CAP.stance||p.stance)===k?'on':''}" data-act="capStance" data-v="${k}">${STANCE[k]}</button>`).join('')}</span><span class="lbl">期限</span><span class="seg">${(i.crypto?[['24h','24h'],['72h','72h'],['168h','7d']]:[['1d','1 日'],['3d','3 日'],['5d','5 日']]).map(([v,t])=>`<button class="${pv.hz===v?'on':''}" data-act="capHz" data-v="${v}">${t}</button>`).join('')}</span><button class="btn ghost sm more" data-act="capMore">${CAP.more?'收起':'更多口径'}${ICONS.chev}</button></div>
    ${CAP.more?`<div class="more-fields"><label class="field"><span>阈值（%）</span><input class="input" id="capThr" placeholder="默认 1×ATR14" value="${CAP.thr?.kind==='pct'?(CAP.thr.ratio*100):''}"></label><label class="field"><span>失效价</span><input class="input" id="capS" placeholder="跌破/涨破即作废" value="${CAP.s??''}"></label><label class="field" style="grid-column:span 2"><span>标签</span><input class="input" id="capTags" placeholder="回踩缩量, 4h" value="${esc(CAP.tags)}"></label></div><div class="mini-hint">也可以直接写在话里：<code>#回踩缩量</code>、<code>3 天</code>、<code>2%</code>、<code>跌破 61500 作废</code> 都能识别。</div>`:''}
    <div class="pf"><span class="ime ${CAP.ime?'on':''}"><i></i>${CAP.ime?'输入法组字中，回车不会提交':'回车提交 · ⇧回车换行'}</span><span class="go"><span class="faint">${CAP.text.trim().length} 字</span><button class="btn primary" data-act="capSave" ${CAP.text.trim()?'':'disabled'}>入账<span class="kbd">↩</span></button></span></div>`;
  layer.innerHTML=`<div class="ov" data-act="capBackdrop"><div class="ovwrap"><div class="panel ${CAP.saving?'saving':''}" data-stop>${CAP.saving?`<div class="progress"><i></i></div>`:''}${inner}</div>
    <div class="demo-states"><span>演示场景</span>${[['normal','正常'],['nosym','品种未识别'],['noshot','无截图']].map(([k,t])=>`<button class="${CAP.demo===k?'on':''}" data-act="capDemo" data-v="${k}">${t}</button>`).join('')}</div></div></div>`;
  const ta=$('#capText'); if(ta&&!CAP.done){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); autosize(ta); }
}
function autosize(ta){ ta.style.height='auto'; ta.style.height=Math.min(260,ta.scrollHeight)+'px'; }
function openCapture(){ CAP.open=true; CAP.done=null; CAP.saving=false; renderCapture(); }
function closeCapture(){ CAP.open=false; CAP.pop=null; renderCapture(); }
function capReset(){ Object.assign(CAP,{text:'',stance:null,hz:null,thr:null,s:null,tags:'',more:false,done:null,saving:false,pop:null}); }
let SEQ=1;
function capSave(){
  if(!CAP.text.trim()||CAP.saving) return; CAP.saving=true; renderCapture();
  setTimeout(()=>{
    const pv=capPreviewCall(); const ins=pv.ins; const i=INSTR[ins]; const id='n'+(SEQ++); const at=NOW.toISOString();
    const noshot=CAP.demo==='noshot'; const unknown=ins==='UNKNOWN';
    const endAt=new Date(NOW.getTime()+(pv.hz.endsWith('h')?+pv.hz.slice(0,-1)*36e5:+pv.hz.slice(0,-1)*864e5)).toISOString();
    const c={id,disp:`C-20260909-${pad(SEQ+1).padStart(3,'0')}`,ins,at,stance:pv.stance,path:'k',tpl:pv.tpl,hz:pv.tpl==='T0'?null:pv.hz,thr:pv.tpl==='T0'||pv.tpl==='T4'?null:pv.thr,s:pv.s,words:CAP.text.trim(),tags:pv.tags,
      state:unknown?'no_criteria':pv.tpl==='T0'?'no_criteria':i.nodata?'insufficient_data':'pending',reason:unknown?'品种待确认':pv.tpl==='T0'?'未设口径':i.nodata?'美股行情尚未接入':null,
      endAt:pv.tpl==='T0'?null:endAt,shot:noshot?null:{seed:40+SEQ,tf:'4h',cap:fmtDT(at).replace(/^/,'2026-').replace('月','-').replace('日',''),nosym:unknown},pre:!noshot,trig:pv.trig,bound:pv.bound,
      gap:unknown?'symbol':noshot?'shot':null,obs:pv.tpl!=='T0'&&!unknown&&!i.nodata?{high:'+0.0%',low:'-0.0%',end:'+0.0%',asof:fmtDT(at)}:null};
    CALLS.unshift(c);
    if(unknown) GAPS.unshift({id:'g'+id,kind:'symbol',call:id,t:'品种待确认',s:'截图窗口未识别出品种，确认后可按原时间与原口径评价'});
    if(noshot) GAPS.unshift({id:'gs'+id,kind:'shot',call:id,t:'这条记录没有现场图',s:'采集时指定窗口失效，可补一张当时的截图（会标为补图）'});
    if(!unknown){ const same=CALLS.find(x=>x.id!==id&&x.ins===ins&&x.episode&&(NOW-new Date(x.at))<120*36e5); if(same){ c.episode=same.episode; c.epLink='suggested'; EPISODES[same.episode].calls.push(id); GAPS.unshift({id:'gg'+id,kind:'group',call:id,t:`归组建议：并入 ${i.sym} 行情段`,s:`同一标的，在 120 小时窗口内`}); } }
    if(c.tags.includes('回踩缩量')){ const v3=PLAYBOOKS['回踩缩量'].versions.find(v=>v.status==='adopted'); if(v3) { v3.samples.push(id); c.pb='回踩缩量:'+v3.v; } }
    CAP.saving=false; CAP.done=c; renderCapture(); renderNav(); if(route().page==='find') refreshLedger();
  },650);
}

/* =========================== toast / lightbox =========================== */
let toastTimer;
function toast(msg,link){ let t=$('.toast'); if(t) t.remove(); t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="ok">${ICONS.check}</span><span>${msg}</span>${link?`<a href="${link.href}">${link.t}</a>`:''}`; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),3200); }
function lightbox(src,cap){ const d=document.createElement('div'); d.className='lightbox'; d.innerHTML=`<img src="${src}" alt=""><div class="cap">${cap||''}</div>`; d.addEventListener('click',()=>d.remove()); document.body.appendChild(d); }

/* =========================== 绑定 =========================== */
function bindPage(){
  const q=$('#q'); if(q){ let comp=false; q.addEventListener('compositionstart',()=>comp=true); q.addEventListener('compositionend',()=>{comp=false; FIND.q=q.value; refreshLedger();}); q.addEventListener('input',()=>{ if(comp) return; FIND.q=q.value; refreshLedger(); }); }
}
document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]'); const actEl=e.target.closest('[data-act]');
  if(!actEl&&goEl&&!e.target.closest('a,button,[data-act]')){ go('#/'+goEl.dataset.go); return; }
  if(!actEl){ if(!e.target.closest('.pop')){ if(FIND.pop||CALLV.more||CAP.pop){ FIND.pop=null; CALLV.more=false; CAP.pop=null; if(CAP.open) renderCapture(); else if(route().page==='find') refreshLedger(); else render(); } } return; }
  const a=actEl.dataset.act, v=actEl.dataset.v; const r=route();
  const call=id=>CALLS.find(c=>c.id===id);
  switch(a){
    case 'focusSearch': if(r.page!=='find') go('#/find'); setTimeout(()=>{ const q=$('#q'); if(q){ q.focus(); q.select(); } },30); break;
    case 'clearQ': FIND.q=''; refreshLedger(); $('#q')?.focus(); break;
    case 'stateMenu': FIND.pop=FIND.pop==='state'?null:'state'; refreshLedger(); break;
    case 'insMenu': FIND.pop=FIND.pop==='ins'?null:'ins'; refreshLedger(); break;
    case 'stanceMenu': FIND.pop=FIND.pop==='stance'?null:'stance'; refreshLedger(); break;
    case 'tagMenu': FIND.pop=FIND.pop==='tag'?null:'tag'; refreshLedger(); break;
    case 'stateMenuClear': FIND.states=[]; FIND.pop=null; refreshLedger(); e.stopPropagation(); break;
    case 'insMenuClear': FIND.ins=null; FIND.pop=null; refreshLedger(); break;
    case 'stanceMenuClear': FIND.stance=null; FIND.pop=null; refreshLedger(); break;
    case 'tagMenuClear': FIND.tag=null; FIND.pop=null; refreshLedger(); break;
    case 'toggleState': FIND.states=FIND.states.includes(v)?FIND.states.filter(x=>x!==v):[...FIND.states,v]; refreshLedger(); break;
    case 'setIns': FIND.ins=v||null; FIND.pop=null; refreshLedger(); break;
    case 'setStance': FIND.stance=v||null; FIND.pop=null; refreshLedger(); break;
    case 'setTag': FIND.tag=v||null; FIND.pop=null; refreshLedger(); break;
    case 'setSort': FIND.sort=v; refreshLedger(); break;
    case 'setGroup': FIND.group=v==='1'; refreshLedger(); break;
    case 'clearFilters': Object.assign(FIND,{q:'',states:[],ins:null,stance:null,tag:null,pop:null}); if(r.page==='find'){ const q=$('#q'); if(q) q.value=''; refreshLedger(); } else go('#/find'); break;
    case 'findTag': e.preventDefault(); Object.assign(FIND,{q:'',states:[],ins:null,stance:null,tag:v,pop:null}); if(r.page==='find') { $('#q').value=''; refreshLedger(); } else go('#/find'); break;
    case 'view': CALLV.view=v; render(); break;
    case 'zoom': lightbox(actEl.dataset.src,actEl.dataset.cap); break;
    case 'more': CALLV.more=!CALLV.more; render(); break;
    case 'copyWords': { const c=call(v); navigator.clipboard?.writeText(c.words).catch(()=>{}); CALLV.more=false; render(); toast('原话已复制'); break; }
    case 'unlink': { const c=call(v); if(c.episode){ EPISODES[c.episode].calls=EPISODES[c.episode].calls.filter(x=>x!==v); c.episode=null; c.epLink=null; GAPS=GAPS.filter(g=>!(g.kind==='group'&&g.call===v)); } CALLV.more=false; render(); toast('已从行情段移出'); break; }
    case 'addShot': { const c=call(v); c.followups=c.followups||[]; c.followups.push({seed:70+SEQ++,at:fmtDT(NOW.toISOString()),kind:'followup'}); if(c.gap==='shot'){ c.gap=null; } GAPS=GAPS.filter(g=>!(g.kind==='shot'&&g.call===v)); if(r.page==='review') refreshReview(); else render(); toast('补图已加入，已标为「补图」'); break; }
    case 'skipGap': GAPS=GAPS.filter(g=>g.id!==v); refreshReview(); toast('已略过'); break;
    case 'fixSymbol': go('#/review/gaps'); break;
    case 'fixSymbolTo': { const g=GAPS.find(x=>x.id===actEl.dataset.g); const c=call(g.call); c.ins=v; c.gap=null; if(c.shot) c.shot.nosym=false; c.reason=c.tpl==='T0'?'未设口径':null; if(c.tpl!=='T0') c.state='pending'; GAPS=GAPS.filter(x=>x.id!==g.id); RV.sel=null; refreshReview(); toast(`已确认为 ${INSTR[v].sym}${c.tpl!=='T0'?'，开始按原口径评价':''}`,{href:'#/call/'+c.id,t:'查看'}); break; }
    case 'confirmGroup': { const c=call(v); c.epLink='confirmed'; GAPS=GAPS.filter(g=>!(g.kind==='group'&&g.call===v)); if(r.page==='review'){ RV.sel=null; refreshReview(); } else render(); renderNav(); toast('已归入行情段'); break; }
    case 'rejectGroup': { const c=call(v); if(c.episode){ EPISODES[c.episode].calls=EPISODES[c.episode].calls.filter(x=>x!==v); } c.episode=null; c.epLink=null; GAPS=GAPS.filter(g=>!(g.kind==='group'&&g.call===v)); if(r.page==='review'){ RV.sel=null; refreshReview(); } else render(); renderNav(); toast('保持单独一条'); break; }
    case 'addTag': { const c=call(v); const t=prompt('加一个标签（不含 #）'); if(t&&t.trim()){ c.tags.push(t.trim().replace(/^#/,'')); render(); toast('标签已加'); } break; }
    case 'qsel': selectQueue({kind:actEl.dataset.k,id:v}); refreshReview(); break;
    case 'rvVs': RV.vs=v; RV.note=$('#rvNote')?.value||RV.note; RV.better=$('#rvBetter')?.value||RV.better; refreshReview(); break;
    case 'rvSave': rvSave(); break;
    case 'rvSkip': { const q=queueItems(); const k=q.findIndex(x=>x.kind===RV.sel.kind&&x.id===RV.sel.id); selectQueue(q[(k+1)%q.length]); refreshReview(); break; }
    case 'vdSave': { RV.note=$('#rvNote')?.value||''; VERDICTS[v]={vs:RV.vs,note:RV.note,at:fmtDT(NOW.toISOString())}; const s=SETS[v]; s.verdict='done'; RV.sel=null; RV.vs=null; RV.note=''; refreshReview(); toast(`#${v} 已裁决：${{keep:'继续用',adjust:'改了再用',retire:'先停用'}[VERDICTS[v].vs]}`,{href:'#/archive/'+encodeURIComponent(v),t:'看档案'}); break; }
    case 'six': AR.six=v||null; render(); break;
    case 'newPbFrom': PB.newPb=true; go('#/playbook'); setTimeout(()=>{ const n=$('#npName'); if(n){ n.value=v; $('#npScope').focus(); } },30); break;
    case 'adopt': { const pb=PLAYBOOKS[PB.cur]; pb.versions.forEach(x=>{ if(x.status==='adopted'){ x.status='history'; x.until='2026-09-09'; } }); const nv=pb.versions.find(x=>x.v===v); nv.status='adopted'; nv.samples=nv.samples||[]; render(); toast(`${v} 已成为现行版本`); break; }
    case 'withdraw': { const pb=PLAYBOOKS[PB.cur]; const nv=pb.versions.find(x=>x.v===v); const why=prompt('为什么撤回？一句话'); if(why===null) break; nv.status='withdrawn'; nv.until='2026-09-09'; nv.withdrawReason=why||'—'; render(); toast(`${v} 已撤回`); break; }
    case 'newVersion': PB.form={}; render(); setTimeout(()=>$('#pbChange')?.focus(),30); break;
    case 'pbCancel': PB.form=null; render(); break;
    case 'pbSubmit': { const ch=$('#pbChange').value.trim(); if(!ch){ $('#pbChange').focus(); break; } const pb=PLAYBOOKS[PB.cur]; const n='v'+(pb.versions.length+1); pb.versions.push({v:n,status:'candidate',at:'2026-09-09',old:$('#pbOld').value||'—',change:ch,basis:$('#pbBasis').value||'—',expect:$('#pbExpect').value||'—',cost:$('#pbCost').value||'—',samples:[]}); PB.form=null; render(); toast(`${n} 已存为候选版本`); break; }
    case 'newPb': PB.newPb=true; render(); setTimeout(()=>$('#npName')?.focus(),30); break;
    case 'npCancel': PB.newPb=false; render(); break;
    case 'npSubmit': { const n=$('#npName').value.trim(); if(!n){ $('#npName').focus(); break; } PLAYBOOKS[n]={scope:$('#npScope').value||'—',versions:[{v:'v1',status:'adopted',at:'2026-09-09',old:'—',change:$('#npChange').value||'—',basis:'—',expect:'—',cost:'—',samples:[]}]}; PB.newPb=false; PB.cur=n; render(); toast(`打法「${n}」已建立`); break; }
    case 'set': SET[actEl.dataset.k]=v; if(actEl.dataset.k==='theme') applyTheme(); render(); break;
    case 'toggle': SET[actEl.dataset.k]=!SET[actEl.dataset.k]; render(); break;
    case 'export': toast('账簿已导出为 scorebook-2026-09-09.zip'); break;
    case 'capBackdrop': if(e.target===actEl&&!CAP.saving) closeCapture(); break;
    case 'capClose': closeCapture(); if(actEl.getAttribute('href')) { /* 链接自行跳转 */ } break;
    case 'capAgain': capReset(); renderCapture(); break;
    case 'capMore': CAP.more=!CAP.more; renderCapture(); break;
    case 'capStance': CAP.stance=CAP.stance===v?null:v; renderCapture(); break;
    case 'capPickStance': CAP.stance='L'; renderCapture(); break;
    case 'capHz': CAP.hz=v; renderCapture(); break;
    case 'capSymMenu': CAP.pop=CAP.pop==='sym'?null:'sym'; renderCapture(); break;
    case 'capPickSym': CAP.ins=v; CAP.demo=CAP.demo==='nosym'?'normal':CAP.demo; CAP.pop=null; renderCapture(); break;
    case 'capDemo': CAP.demo=v; renderCapture(); break;
    case 'capSave': capSave(); break;
  }
});
function rvSave(){
  if(!RV.sel||RV.sel.kind!=='call'||!RV.vs) return; const c=CALLS.find(x=>x.id===RV.sel.id);
  RV.note=$('#rvNote')?.value||''; RV.better=$('#rvBetter')?.value||'';
  REVIEWS[c.id]={vs:RV.vs,note:RV.note,better:RV.better,at:'今天'};
  let extra='';
  if(RV.better.trim()){ const tag=c.tags.find(t=>PLAYBOOKS[t]); const pbName=tag||c.tags[0]||INSTR[c.ins].name; if(!PLAYBOOKS[pbName]) PLAYBOOKS[pbName]={scope:'从复盘中产生，范围待补',versions:[]}; const pb=PLAYBOOKS[pbName]; const n='v'+(pb.versions.length+1); pb.versions.push({v:n,status:'candidate',at:'2026-09-09',old:pb.versions.find(x=>x.status==='adopted')?.change||'—',change:RV.better.trim(),basis:c.disp,expect:'—',cost:'—',samples:[]}); extra=`，改法已存为 ${pbName} ${n} 候选`; }
  RV.sel=null; RV.vs=null; RV.note=''; RV.better='';
  refreshReview(); toast(`已复盘${extra}`,{href:'#/call/'+c.id,t:'查看'});
}
document.addEventListener('input',e=>{
  if(e.target.id==='capText'){ CAP.text=e.target.value; autosize(e.target); const chips=$('.panel .parse'); renderCaptureLight(); }
  if(e.target.id==='capThr'){ const n=parseFloat(e.target.value); CAP.thr=isNaN(n)?null:{kind:'pct',ratio:n/100}; }
  if(e.target.id==='capS'){ const n=parseFloat(e.target.value.replace(/,/g,'')); CAP.s=isNaN(n)?null:n; }
  if(e.target.id==='capTags'){ CAP.tags=e.target.value; }
  if(e.target.id==='rvNote') RV.note=e.target.value; if(e.target.id==='rvBetter') RV.better=e.target.value;
});
function renderCaptureLight(){ /* 只更新解析区、句子、字数与按钮，不打断输入 */
  const ta=$('#capText'); if(!ta) return; const sel=[ta.selectionStart,ta.selectionEnd]; const h=ta.style.height; renderCapture(); const t2=$('#capText'); if(t2){ t2.style.height=h; t2.setSelectionRange(sel[0],sel[1]); } }
document.addEventListener('compositionstart',e=>{ if(e.target.id==='capText'){ CAP.ime=true; $('.panel .pf .ime')?.classList.add('on'); } });
document.addEventListener('compositionend',e=>{ if(e.target.id==='capText'){ CAP.ime=false; CAP.text=e.target.value; renderCaptureLight(); } });
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey; const tag=e.target.tagName; const typing=tag==='INPUT'||tag==='TEXTAREA';
  if(e.ctrlKey&&e.shiftKey&&e.code==='KeyS'){ e.preventDefault(); openCapture(); return; }
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(route().page!=='find') go('#/find'); setTimeout(()=>{ const q=$('#q'); if(q){ q.focus(); q.select(); } },30); return; }
  if(e.key==='Escape'){ if($('.lightbox')){ $('.lightbox').remove(); return; } if(CAP.open){ if(CAP.pop){ CAP.pop=null; renderCapture(); } else closeCapture(); return; } if(FIND.pop||CALLV.more){ FIND.pop=null; CALLV.more=false; route().page==='find'?refreshLedger():render(); return; } if(typing){ e.target.blur(); } return; }
  if(CAP.open){ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!CAP.ime&&e.target.id==='capText'){ e.preventDefault(); capSave(); } if(mod&&e.key==='Enter'){ e.preventDefault(); capSave(); } return; }
  const r=route();
  if(mod&&e.key==='Enter'){ if(r.page==='review'){ e.preventDefault(); if(RV.sel?.kind==='verdict'){ $('[data-act="vdSave"]')?.click(); } else rvSave(); } return; }
  if(typing) return;
  if(r.page==='find'){
    const rows=$$('.lrow'); if(!rows.length) return;
    if(e.key==='j'||e.key==='k'){ e.preventDefault(); FIND.cursor=Math.max(0,Math.min(rows.length-1,FIND.cursor+(e.key==='j'?1:-1))); rows[FIND.cursor].focus(); rows[FIND.cursor].scrollIntoView({block:'nearest'}); }
    if(e.key==='Enter'&&document.activeElement.classList.contains('lrow')) go('#/'+document.activeElement.dataset.go);
    if(e.key==='/'){ e.preventDefault(); $('#q')?.focus(); }
  }
  if(r.page==='call'){ const list=filteredCalls(); const k=list.findIndex(x=>x.id===r.arg); if(e.key==='ArrowLeft'&&list[k-1]) go('#/call/'+list[k-1].id); if(e.key==='ArrowRight'&&list[k+1]) go('#/call/'+list[k+1].id); if(e.key==='Backspace'){ e.preventDefault(); history.back(); } }
  if(r.page==='review'){
    const q=queueItems(); const k=q.findIndex(x=>RV.sel&&x.kind===RV.sel.kind&&x.id===RV.sel.id);
    if(e.key==='j'&&q[k+1]){ selectQueue(q[k+1]); refreshReview(); } if(e.key==='k'&&q[k-1]){ selectQueue(q[k-1]); refreshReview(); }
    if(['1','2','3'].includes(e.key)){ const btns=$$('.opt:not([disabled])'); const b=btns[+e.key-1]; if(b) b.click(); }
  }
});
$('#btnCapture').addEventListener('click',openCapture);
applyTheme(); render();
</script>
